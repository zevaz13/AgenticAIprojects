    - generic [ref=e60]:
      - generic [ref=e61]:
        - heading "Ajiaco Recipe – Traditional Colombian Chicken Potato Soup" [level=2] [ref=e62]:
          - strong [ref=e63]: Ajiaco Recipe – Traditional Colombian Chicken Potato Soup
        - paragraph [ref=e64]:
          - text: This
          - strong [ref=e65]: Ajiaco recipe
          - text: "showcases Bogotá’s most iconic comfort food: a fragrant chicken and potato soup enriched with corn and the herb"
          - emphasis [ref=e66]: guascas
          - text: . Creamy from naturally thickened potatoes and served with capers, cream, and avocado,
          - strong [ref=e67]: Ajiaco
          - text: is a hearty Colombian classic perfect for chilly days or family gatherings.
        - separator [ref=e68]
        - heading "Ingredients (serves 6)" [level=3] [ref=e69]:
          - text: Ingredients
          - emphasis [ref=e70]: (serves 6)
        - paragraph [ref=e71]:
          - strong [ref=e72]: Soup Base
        - list [ref=e73]:
          - listitem [ref=e74]:
            - paragraph [ref=e75]: 3 bone-in, skin-on chicken breasts or thighs (about 2 lbs / 900 g)
          - listitem [ref=e76]:
            - paragraph [ref=e77]: 10 cups (2.4 L) chicken broth or water
          - listitem [ref=e78]:
            - paragraph [ref=e79]: 3 garlic cloves, minced
          - listitem [ref=e80]:
            - paragraph [ref=e81]: 1 medium onion, chopped
          - listitem [ref=e82]:
            - paragraph [ref=e83]: 2 bay leaves
          - listitem [ref=e84]:
            - paragraph [ref=e85]: 1 tsp salt
        - paragraph [ref=e86]:
          - strong [ref=e87]: Potatoes & Vegetables
        - list [ref=e88]:
          - listitem [ref=e89]:
            - paragraph [ref=e90]: 1 lb (450 g) russet potatoes, peeled and sliced
          - listitem [ref=e91]:
            - paragraph [ref=e92]: 1 lb (450 g) red potatoes, peeled and sliced
          - listitem [ref=e93]:
            - paragraph [ref=e94]: 1 lb (450 g) small Andean potatoes (papa criolla) or yellow potatoes, halved
          - listitem [ref=e95]:
            - paragraph [ref=e96]: 3 ears fresh corn, cut into 3-inch pieces
          - listitem [ref=e97]:
            - paragraph [ref=e98]: 1 tsp ground cumin
          - listitem [ref=e99]:
            - paragraph [ref=e100]:
              - text: 1 tsp dried
              - emphasis [ref=e101]: guascas
              - text: (available in Latin markets or online)
          - listitem [ref=e102]:
            - paragraph [ref=e103]: ½ cup (120 ml) heavy cream
        - paragraph [ref=e104]:
          - strong [ref=e105]: Garnishes
        - list [ref=e106]:
          - listitem [ref=e107]:
            - paragraph [ref=e108]: ½ cup (75 g) capers, drained
          - listitem [ref=e109]:
            - paragraph [ref=e110]: 2 ripe avocados, sliced
          - listitem [ref=e111]:
            - paragraph [ref=e112]: Lime wedges
          - listitem [ref=e113]:
            - paragraph [ref=e114]: Fresh cilantro, chopped
        - separator [ref=e115]
        - heading "How to Make Ajiaco Recipe" [level=3] [ref=e116]
        - heading "1. Simmer the Chicken" [level=4] [ref=e117]
        - paragraph [ref=e118]: In a large pot, combine chicken, broth, garlic, onion, bay leaves, and salt. Bring to a boil, then reduce heat and simmer 35–40 minutes until chicken is cooked through. Remove chicken, shred the meat, and set aside.
        - heading "2. Cook the Potatoes" [level=4] [ref=e119]
        - paragraph [ref=e120]: Add russet, red, and yellow potatoes to the broth. Simmer 25–30 minutes until the potatoes begin to break down and naturally thicken the soup.
        - heading "3. Add Corn and Seasonings" [level=4] [ref=e121]
        - paragraph [ref=e122]: Stir in corn pieces, cumin, and dried guascas. Continue simmering 15 minutes.
        - heading "4. Finish the Soup" [level=4] [ref=e123]
        - paragraph [ref=e124]: Return shredded chicken to the pot. Stir in heavy cream and adjust salt to taste.
        - separator [ref=e125]
        - heading "Serving the Ajiaco Recipe" [level=3] [ref=e126]
        - list [ref=e127]:
          - listitem [ref=e128]:
            - paragraph [ref=e129]: Ladle the soup into deep bowls and top with fresh cilantro.
          - listitem [ref=e130]:
            - paragraph [ref=e131]: Serve with capers, avocado slices, and lime wedges on the side so each guest can customize their bowl.
          - listitem [ref=e132]:
            - paragraph [ref=e133]: Pair with crusty bread or arepas for a complete meal.
        - separator [ref=e134]
        - heading "Pro Tips" [level=3] [ref=e135]
        - list [ref=e136]:
          - listitem [ref=e137]:
            - paragraph [ref=e138]:
              - strong [ref=e139]: "Guascas Is Key:"
              - text: This herb gives Ajiaco its authentic flavor. If unavailable, substitute a small pinch of dried oregano and parsley, though the taste will differ slightly.
          - listitem [ref=e140]:
            - paragraph [ref=e141]:
              - strong [ref=e142]: "Three Potatoes:"
              - text: The combination of starchy and waxy potatoes provides the perfect creamy texture.
          - listitem [ref=e143]:
            - paragraph [ref=e144]:
              - strong [ref=e145]: "Make Ahead:"
              - text: The soup tastes even better the next day as flavors meld.
        - separator [ref=e146]
        - heading "Storage" [level=3] [ref=e147]
        - paragraph [ref=e148]:
          - text: Cool completely and refrigerate in an airtight container for up to 4 days. Reheat gently on the stovetop, adding a splash of broth if needed. This
          - strong [ref=e149]: Ajiaco recipe
          - text: also freezes well for up to 2 months.
        - separator [ref=e150]
        - heading "Frequently Asked Questions" [level=3] [ref=e151]
        - paragraph [ref=e152]:
          - strong [ref=e153]: Can I use boneless chicken?
          - text: Yes, but bone-in pieces create a richer broth and deeper flavor.
        - paragraph [ref=e154]:
          - strong [ref=e155]: Can I substitute other herbs for guascas?
          - text: You can try oregano and parsley, but traditional guascas give the signature taste.
        - paragraph [ref=e156]:
          - strong [ref=e157]: Is Ajiaco spicy?
          - text: No, it’s mild. Add hot sauce or minced chili if you prefer heat.
