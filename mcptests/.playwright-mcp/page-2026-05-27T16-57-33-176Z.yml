      - paragraph [ref=e96]: Gaby has so many favorite appetizers, it really is hard to choose which ones are the best. For the theme of this menu I have chosen Pizza Monkey Bread and her mindblowing Cheesy Artichoke Dip. IFYKY. If I sit down at a table and these are the first two things brought out, I know its going to be an epic meal. Give me all the carbs to kick off the good times.
