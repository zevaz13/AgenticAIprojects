      - generic [ref=e132]:
        - paragraph [ref=e133]: For the Main Event I am going with an iteration of the very first meal Gaby ever made for me, Chicken Parm. The Chicken Parm meatballs are very similar to the OG dish but in amazing bite sized balls filled with cheese. Perfection.
        - paragraph [ref=e134]:
          - text: For my second main course I am going the Detroit style pizza. We have a pizza oven and the pies we pump out of it are game changers. If you are interested in making pizza in your oven or in a pizza oven check out
