      - paragraph [ref=e114]:
        - text: Sides might just be my favorite part of the meal. It’s one of those elements of a meal that always under promises and over delivers. The two sides I have listed are my ALL TIME favorites from Gaby. I could eat these 8 days a week. The parm roasted potatoes (regular or sweet) are legendary and the crunch is perfection. The Broccolini with lemon and garlic is a match made in heaven. AND BECAUSE I enjoy sides so much I am giving you a bonus. Any of the roasted vegetables listed out here in the
        - link "ROASTED VEGGIES" [ref=e115] [cursor=pointer]:
          - /url: https://whatsgabycooking.com/roasted-vegetables-101/
        - text: are to die for. Also they were the first things I ever learned how to cook.
