      - paragraph [ref=e78]: You may or may not know this, but Gaby and I love to host. So when it comes to being the ultimate host you need to know how to build out the ultimate appetizer board and have a fully stocked bar cart. In my opinion, the trick to being a great host is to make sure everyone feels welcome and relaxed. What is more relaxing than having an awesome selection of booze to choose from and an appetizer board that has a little bit of everything for everyone.
