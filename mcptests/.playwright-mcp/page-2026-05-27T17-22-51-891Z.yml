          - figure "A Russian Federation commemorative Rachmaninoff coin" [ref=e1537]:
            - link [ref=e1538] [cursor=pointer]:
              - /url: /wiki/File:RR5216-0007R_%D0%A1.%D0%92.%D0%A0%D0%B0%D1%85%D0%BC%D0%B0%D0%BD%D0%B8%D0%BD%D0%BE%D0%B2.png
              - img [ref=e1539]
            - generic [ref=e1540]: A Russian Federation commemorative Rachmaninoff coin
          - paragraph [ref=e1541]:
            - text: Rachmaninoff's reputation as a composer generated a variety of opinions before his music gained steady recognition around the world. The 1954 edition of the
            - link "Grove Dictionary of Music and Musicians" [ref=e1543] [cursor=pointer]:
              - /url: /wiki/Grove_Dictionary_of_Music_and_Musicians
            - text: notoriously dismissed Rachmaninoff's music as "monotonous in texture ... consist[ing] mainly of artificial and gushing tunes" and predicted that his popular success was "not likely to last".
            - superscript [ref=e1544]:
              - link "[253]" [ref=e1545] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESchonberg1997[httpsarchiveorgdetailslivesofgreatcomp00scho_1page520mode2up_520]-258"
            - superscript [ref=e1546]:
              - link "[254]" [ref=e1547] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990[httpsbooksgooglecombooksid_zkrDwAAQBAJpgPA16_16]-259"
            - text: To this,
            - link "Harold C. Schonberg" [ref=e1548] [cursor=pointer]:
              - /url: /wiki/Harold_C._Schonberg
            - text: ", in his Lives of the Great Composers, responded: \"It is one of the most outrageously snobbish and even stupid statements ever to be found in a work that is supposed to be an objective reference.\""
            - superscript [ref=e1549]:
              - link "[253]" [ref=e1550] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESchonberg1997[httpsarchiveorgdetailslivesofgreatcomp00scho_1page520mode2up_520]-258"
          - paragraph [ref=e1551]:
            - text: The
            - link "Conservatoire Rachmaninoff" [ref=e1552] [cursor=pointer]:
              - /url: /wiki/Conservatoire_Rachmaninoff
            - text: in Paris, as well as streets in
            - link "Veliky Novgorod" [ref=e1553] [cursor=pointer]:
              - /url: /wiki/Veliky_Novgorod
            - text: (which is close to his birthplace) and
            - link "Tambov" [ref=e1554] [cursor=pointer]:
              - /url: /wiki/Tambov
            - text: ", are named after the composer. In 1986, the Moscow Conservatory dedicated a concert hall on its premises to Rachmaninoff, designating the 252-seat auditorium Rachmaninoff Hall, and in 1999 the"
            - link "\"Monument to Sergei Rachmaninoff\"" [ref=e1555] [cursor=pointer]:
              - /url: /wiki/Monument_to_Sergei_Rachmaninov
            - text: was installed in Moscow. A separate monument to Rachmaninoff was unveiled in Veliky Novgorod, near his birthplace, on 14 June 2009. The 2015 musical
            - link "Preludes" [ref=e1557] [cursor=pointer]:
              - /url: /wiki/Preludes_(musical)
            - text: by
            - link "Dave Malloy" [ref=e1558] [cursor=pointer]:
              - /url: /wiki/Dave_Malloy
            - text: depicts Rachmaninoff's struggle with depression and writer's block.
          - paragraph [ref=e1559]:
            - text: "A statue marked \"Rachmaninoff: The Last Concert\", designed and sculpted by Victor Bokarev, stands at the"
            - link "World's Fair Park" [ref=e1560] [cursor=pointer]:
              - /url: /wiki/World%27s_Fair_Park
            - text: in Knoxville, Tennessee, as a tribute to the composer. In Alexandria, Virginia in 2019, a Rachmaninoff concert performed by the Alexandria Symphony Orchestra played to wide acclaim. Attendees were treated to a talk prior to the performance by Rachmaninoff's great-granddaughter, Natalie Wanamaker Javier, who joined Rachmaninoff scholar Francis Crociata and
            - link "Library of Congress" [ref=e1561] [cursor=pointer]:
              - /url: /wiki/Library_of_Congress
            - text: music specialist Kate Rivers on a panel of discussants about the composer and his contributions.
            - superscript [ref=e1562]:
              - link "[255]" [ref=e1563] [cursor=pointer]:
                - /url: "#cite_note-260"
