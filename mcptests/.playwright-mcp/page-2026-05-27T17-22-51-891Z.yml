          - paragraph [ref=e117]:
            - text: Sergei Vasilyevich Rachmaninoff
            - superscript [ref=e118]:
              - link "[a]" [ref=e119] [cursor=pointer]:
                - /url: "#cite_note-2"
            - superscript [ref=e120]:
              - link "[b]" [ref=e121] [cursor=pointer]:
                - /url: "#cite_note-5"
            - text: (1 April [
            - link "O.S." [ref=e122] [cursor=pointer]:
              - /url: /wiki/Old_Style_and_New_Style_dates
            - text: 20 March] 1873 – 28 March 1943) was a Russian composer,
            - link "virtuoso pianist" [ref=e123] [cursor=pointer]:
              - /url: /wiki/Virtuoso_pianist
            - text: ", and conductor. Rachmaninoff is widely considered one of the finest pianists of his day and, as a composer, one of the last great representatives of"
            - link "Romanticism" [ref=e124] [cursor=pointer]:
              - /url: /wiki/Romantic_music
            - text: in
            - link "Russian classical music" [ref=e125] [cursor=pointer]:
              - /url: /wiki/Russian_classical_music
            - text: . Early influences of
            - link "Tchaikovsky" [ref=e126] [cursor=pointer]:
              - /url: /wiki/Tchaikovsky
            - text: ","
            - link "Rimsky-Korsakov" [ref=e127] [cursor=pointer]:
              - /url: /wiki/Rimsky-Korsakov
            - text: ", and other Russian composers gave way to a thoroughly personal idiom notable for its song-like melodicism,"
            - link "expressiveness" [ref=e128] [cursor=pointer]:
              - /url: /wiki/Music#Expression
            - text: ", dense"
            - link "contrapuntal" [ref=e129] [cursor=pointer]:
              - /url: /wiki/Counterpoint
            - text: textures, and rich
            - link "orchestral" [ref=e130] [cursor=pointer]:
              - /url: /wiki/Orchestration
            - text: colours.
            - superscript [ref=e131]:
              - link "[4]" [ref=e132] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001b[httpsarchiveorgdetailsnewgrovedictiona0020unsepage707mode2up_707]-6"
            - text: The piano is featured prominently in Rachmaninoff's compositional output and he used his skills as a performer to fully explore the expressive and technical possibilities of the instrument.
          - paragraph [ref=e133]:
            - text: Born into a musical family, Rachmaninoff began learning the piano at the age of four. He studied piano and composition at the
            - link "Moscow Conservatory" [ref=e134] [cursor=pointer]:
              - /url: /wiki/Moscow_Conservatory
            - text: ", from which he graduated in 1892, having already written several compositions. In 1897, following the disastrous premiere of his"
            - link "Symphony No. 1" [ref=e135] [cursor=pointer]:
              - /url: /wiki/Symphony_No._1_(Rachmaninoff)
            - text: ", Rachmaninoff entered a four-year depression and composed little, until supportive therapy allowed him to complete his well-received"
            - link "Piano Concerto No. 2" [ref=e136] [cursor=pointer]:
              - /url: /wiki/Piano_Concerto_No._2_(Rachmaninoff)
            - text: in 1901. Rachmaninoff went on to become conductor of the
            - link "Bolshoi Theatre" [ref=e137] [cursor=pointer]:
              - /url: /wiki/Bolshoi_Theatre
            - text: from 1904 to 1906, and relocated to
            - link "Dresden" [ref=e138] [cursor=pointer]:
              - /url: /wiki/Dresden
            - text: ", Germany, in 1906. He later embarked upon his first tour of the United States as a concert pianist in 1909."
          - paragraph [ref=e139]:
            - text: After the
            - link "Russian Revolution" [ref=e140] [cursor=pointer]:
              - /url: /wiki/Russian_Revolution
            - text: ", Rachmaninoff and his family left Russia permanently, settling in New York in 1918. Following this, he spent most of his time touring as a pianist in the US and Europe, from 1932 onwards spending his summers at"
            - link "his villa" [ref=e141] [cursor=pointer]:
              - /url: /wiki/Villa_Senar
            - text: in Switzerland. During this time, Rachmaninoff's primary occupation was performing, and his compositional output decreased significantly, completing just six works after leaving Russia. By 1942, his declining health led him to move to
            - link "Beverly Hills, California" [ref=e142] [cursor=pointer]:
              - /url: /wiki/Beverly_Hills,_California
            - text: ", where he died from"
            - link "melanoma" [ref=e143] [cursor=pointer]:
              - /url: /wiki/Melanoma
            - text: in 1943.
          - generic [ref=e144]:
            - heading "Life and career" [level=2] [ref=e145]
            - generic [ref=e146]:
              - text: "["
              - link "edit" [ref=e147] [cursor=pointer]:
                - /url: /w/index.php?title=Sergei_Rachmaninoff&action=edit&section=1
              - text: "]"
          - generic [ref=e148]:
            - 'heading "1873–1885: Ancestry and early years" [level=3] [ref=e149]': "1873–1885: Ancestry and early years"
            - generic [ref=e150]:
              - text: "["
              - link "edit" [ref=e151] [cursor=pointer]:
                - /url: /w/index.php?title=Sergei_Rachmaninoff&action=edit&section=2
              - text: "]"
          - figure "Rachmaninoff at age 10 in Saint Petersburg, Russia" [ref=e152]:
            - link [ref=e153] [cursor=pointer]:
              - /url: /wiki/File:Rach10.jpg
              - img [ref=e154]
            - generic [ref=e155]: Rachmaninoff at age 10 in Saint Petersburg, Russia
          - paragraph [ref=e156]:
            - text: Rachmaninoff was born on 1 April [
            - link "O.S." [ref=e157] [cursor=pointer]:
              - /url: /wiki/Old_Style_and_New_Style_dates
            - text: 20 March] 1873 into a family of
            - link "Russian aristocracy" [ref=e158] [cursor=pointer]:
              - /url: /wiki/Russian_aristocracy
            - text: .
            - superscript [ref=e159]:
              - link "[c]" [ref=e160] [cursor=pointer]:
                - /url: "#cite_note-7"
            - text: The family tradition claims descent from a legendary Vasily, nicknamed "Rachman", a supposed grandson of
            - link "Stephen III of Moldavia" [ref=e161] [cursor=pointer]:
              - /url: /wiki/Stephen_III_of_Moldavia
            - text: .
            - superscript [ref=e162]:
              - link "[5]" [ref=e163] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage5mode2up_5]-8"
            - superscript [ref=e164]:
              - link "[6]" [ref=e165] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEUnbegaunUspenskiĭ1989[httpsarchiveorgdetailsrussiansurnamespagen107mode2up_108]-9"
            - text: Rachmaninoff's family had strong musical and military leanings. His paternal grandfather, Arkady Alexandrovich, was a musician who had taken lessons from
            - link "Irish" [ref=e166] [cursor=pointer]:
              - /url: /wiki/Irish_people
            - text: composer
            - link "John Field" [ref=e167] [cursor=pointer]:
              - /url: /wiki/John_Field_(composer)
            - text: .
            - superscript [ref=e168]:
              - link "[5]" [ref=e169] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage5mode2up_5]-8"
            - superscript [ref=e170]:
              - link "[7]" [ref=e171] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990[httpsbooksgooglecombooksid_zkrDwAAQBAJpgPA35_35]-10"
            - text: His father, Vasily Arkadievich Rachmaninoff (1841–1916), was a retired army officer and amateur pianist who married Lyubov Petrovna Butakova (1853–1929), the daughter of a wealthy army general who gave him five estates as part of her
            - link "dowry" [ref=e172] [cursor=pointer]:
              - /url: /wiki/Dowry
            - text: ". The couple had three sons: Vladimir, Sergei and Arkady and three daughters; Yelena, Sofia and Barbara; Sergei being their third child."
            - superscript [ref=e173]:
              - link "[8]" [ref=e174] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESylvester2014[httpsbooksgooglecombooksidt3rDAgAAQBAJpgPA3_3]-11"
            - superscript [ref=e175]:
              - link "[9]" [ref=e176] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage6mode2up_6]-12"
            - superscript [ref=e177]:
              - link "[10]" [ref=e178] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage5mode2up_5]-13"
            - superscript [ref=e179]:
              - link "[11]" [ref=e180] [cursor=pointer]:
                - /url: "#cite_note-:0-14"
          - paragraph [ref=e181]:
            - text: Rachmaninoff was born in the family estate in the village of Semyonovo, near
            - link "Staraya Russa" [ref=e182] [cursor=pointer]:
              - /url: /wiki/Staraya_Russa
            - text: ", Novgorod Governorate. His birth was registered in the Semyonovo church book."
            - superscript [ref=e183]:
              - link "[9]" [ref=e184] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage6mode2up_6]-12"
            - text: After Sergei turned four, the family moved to their estate in Oneg, about 110 miles (180 km) north of Semyonovo, where he was raised until the age of nine. He mistakenly cited it as his birthplace in his adult life.
            - superscript [ref=e185]:
              - link "[12]" [ref=e186] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESylvester2014[httpsbooksgooglecombooksidt3rDAgAAQBAJpgPA2_2]-15"
            - text: Rachmaninoff began piano and music lessons organized by his mother at age four.
            - superscript [ref=e187]:
              - link "[12]" [ref=e188] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESylvester2014[httpsbooksgooglecombooksidt3rDAgAAQBAJpgPA2_2]-15"
            - text: She noticed his ability to correctly reproduce passages from memory and upon hearing news of the boy's gift, Arkady suggested she hire Anna Ornatskaya, a piano teacher and recent graduate of the
            - link "Saint Petersburg Conservatory" [ref=e189] [cursor=pointer]:
              - /url: /wiki/Saint_Petersburg_Conservatory
            - text: ", to live with the family and give the young Sergei formal piano lessons. Rachmaninoff dedicated his famous romance for voice and piano \"Spring Waters\" from 12 Romances, Op. 14, to Ornatskaya."
            - superscript [ref=e190]:
              - link "[8]" [ref=e191] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESylvester2014[httpsbooksgooglecombooksidt3rDAgAAQBAJpgPA3_3]-11"
          - paragraph [ref=e192]:
            - text: Rachmaninoff's father wanted him to be trained by the
            - link "Page Corps" [ref=e193] [cursor=pointer]:
              - /url: /wiki/Page_Corps
            - text: and then join the military, but financial incompetence forced him to sell the family's five estates to pay off debts and therefore could not afford his expensive military career.
            - superscript [ref=e194]:
              - link "[13]" [ref=e195] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage7mode2up_7–8]-16"
            - superscript [ref=e196]:
              - link "[14]" [ref=e197] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESylvester2014[httpsbooksgooglecombooksidt3rDAgAAQBAJpgPA3_3–4]-17"
            - text: His older brother Vladimir was sent to an ordinary military college.
            - superscript [ref=e198]:
              - link "[11]" [ref=e199] [cursor=pointer]:
                - /url: "#cite_note-:0-14"
            - text: The last estate in Oneg was auctioned off in 1882,
            - superscript [ref=e200]:
              - link "[10]" [ref=e201] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage5mode2up_5]-13"
            - text: and the family moved to a small flat in Saint Petersburg.
            - superscript [ref=e202]:
              - link "[15]" [ref=e203] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTERiesemann1934[httpsarchiveorgdetailsinernetdli2015179919pagen43mode2up_29]-18"
            - text: In 1883, Ornatskaya arranged for Rachmaninoff, then 10, to study music at the Saint Petersburg Conservatory under her former teacher,
            - link "Gustav Kross" [ref=e204] [cursor=pointer]:
              - /url: /wiki/Gustav_Kross
            - text: . Later that year, his sister Sofia died at the age of 13 of
            - link "diphtheria" [ref=e205] [cursor=pointer]:
              - /url: /wiki/Diphtheria
            - text: ", and his father, described by Rachmaninoff as a \"compulsive gambler, a pathological liar and a skirt chaser\", left the family for Moscow."
            - superscript [ref=e206]:
              - link "[16]" [ref=e207] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage9mode2up_9]-19"
            - text: His maternal grandmother, Sofia Litvikova Butakova, a widow of General Butakov, stepped in to help raise the children, covered household expenses,
            - superscript [ref=e208]:
              - link "[11]" [ref=e209] [cursor=pointer]:
                - /url: "#cite_note-:0-14"
            - text: and, with particular focus on their religious life, regularly took Rachmaninoff to
            - link "Russian Orthodox Church" [ref=e210] [cursor=pointer]:
              - /url: /wiki/Russian_Orthodox_Church
            - text: services, where he first encountered
            - link "liturgical" [ref=e211] [cursor=pointer]:
              - /url: /wiki/Liturgy
            - text: chants and church bells, two features he would incorporate in his compositions.
            - superscript [ref=e212]:
              - link "[17]" [ref=e213] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTERiesemann1934[httpsarchiveorgdetailsinernetdli2015179919pagen49mode2up_33–34]-20"
          - figure "Alexander Siloti and Rachmaninoff" [ref=e214]:
            - link [ref=e215] [cursor=pointer]:
              - /url: /wiki/File:ASilotiRachmaninoff.jpg
              - img [ref=e216]
            - generic [ref=e217]: Alexander Siloti and Rachmaninoff
          - paragraph [ref=e218]:
            - text: In 1885, Rachmaninoff suffered a further loss when his sister Yelena died at age 18 of
            - link "pernicious anaemia" [ref=e219] [cursor=pointer]:
              - /url: /wiki/Pernicious_anaemia
            - text: .
            - superscript [ref=e220]:
              - link "[18]" [ref=e221] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage7mode2up_7]-21"
            - text: She was an important musical influence on Rachmaninoff and had introduced him to the works of
            - link "Pyotr Ilyich Tchaikovsky" [ref=e222] [cursor=pointer]:
              - /url: /wiki/Pyotr_Ilyich_Tchaikovsky
            - text: .
            - superscript [ref=e223]:
              - link "[19]" [ref=e224] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990[httpsbooksgooglecombooksid_zkrDwAAQBAJpgPA11_11]-22"
            - text: As a respite, his grandmother took him to a farm retreat by the
            - link "Volkhov River" [ref=e225] [cursor=pointer]:
              - /url: /wiki/Volkhov_River
            - text: .
            - superscript [ref=e226]:
              - link "[20]" [ref=e227] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage11mode2up_11]-23"
            - text: At the Conservatory, however, he had adopted a relaxed attitude, played truant, failed his general education classes and purposely altered his report cards.
            - superscript [ref=e228]:
              - link "[21]" [ref=e229] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage5mode2up_5]-24"
            - text: Rachmaninoff performed at events held at the Moscow Conservatory during this time, including those attended by the
            - link "Grand Duke Konstantin" [ref=e230] [cursor=pointer]:
              - /url: /wiki/Grand_Duke_Konstantin_Konstantinovich_of_Russia
            - text: and other notable figures. However, upon his failing his spring exams, Ornatskaya notified his mother that his admission to further education might be revoked.
            - superscript [ref=e231]:
              - link "[20]" [ref=e232] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage11mode2up_11]-23"
            - text: His mother then sought advice from
            - link "Alexander Siloti" [ref=e233] [cursor=pointer]:
              - /url: /wiki/Alexander_Siloti
            - text: ", her nephew, who was an accomplished pianist and a former student of"
            - link "Franz Liszt" [ref=e234] [cursor=pointer]:
              - /url: /wiki/Franz_Liszt
            - text: . He recommended that Rachmaninoff transfer to the
            - link "Moscow Conservatory" [ref=e235] [cursor=pointer]:
              - /url: /wiki/Moscow_Conservatory
            - text: to study under his former piano teacher, the stricter
            - link "Nikolai Zverev" [ref=e236] [cursor=pointer]:
              - /url: /wiki/Nikolai_Zverev
            - text: ","
            - superscript [ref=e237]:
              - link "[22]" [ref=e238] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage46mode2up_46]-25"
            - text: which lasted until 1888.
            - superscript [ref=e239]:
              - link "[23]" [ref=e240] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESylvester2014[httpsbooksgooglecombooksidt3rDAgAAQBAJpgPA6_6–7]-26"
          - generic [ref=e241]:
            - 'heading "1885–1894: Moscow Conservatory and first compositions" [level=3] [ref=e242]': "1885–1894: Moscow Conservatory and first compositions"
            - generic [ref=e243]:
              - text: "["
              - link "edit" [ref=e244] [cursor=pointer]:
                - /url: /w/index.php?title=Sergei_Rachmaninoff&action=edit&section=3
              - text: "]"
          - paragraph [ref=e245]:
            - text: In the autumn of 1885, Rachmaninoff moved in with Zverev, as was customary at the time, and stayed there for almost four years. During this time, he befriended fellow pupil
            - link "Alexander Scriabin" [ref=e246] [cursor=pointer]:
              - /url: /wiki/Alexander_Scriabin
            - text: .
            - superscript [ref=e247]:
              - link "[24]" [ref=e248] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage15mode2up_15]-27"
            - text: While living in Zverev's home, Rachmaninoff shared a bedroom with three other students, and took turns practicing the piano for three hours each day.
            - superscript [ref=e249]:
              - link "[25]" [ref=e250] [cursor=pointer]:
                - /url: "#cite_note-28"
            - text: After two years of study, the fifteen-year-old Rachmaninoff was awarded a
            - link "Rubinstein" [ref=e251] [cursor=pointer]:
              - /url: /wiki/Anton_Rubinstein
            - text: scholarship,
            - superscript [ref=e252]:
              - link "[26]" [ref=e253] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage14mode2up_14]-29"
            - text: and graduated from the lower division of the Conservatory. He then became a pupil of Siloti for advanced piano, studied
            - link "counterpoint" [ref=e254] [cursor=pointer]:
              - /url: /wiki/Counterpoint
            - text: under
            - link "Sergei Taneyev" [ref=e255] [cursor=pointer]:
              - /url: /wiki/Sergei_Taneyev
            - text: ", and learned free composition from"
            - link "Anton Arensky" [ref=e256] [cursor=pointer]:
              - /url: /wiki/Anton_Arensky
            - text: .
            - superscript [ref=e257]:
              - link "[27]" [ref=e258] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage27mode2up_27]-30"
            - superscript [ref=e259]:
              - link "[28]" [ref=e260] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2002[httpsarchiveorgdetailsisbn_9780198662129page1025mode2up_1025]-31"
            - text: In 1889, a rift formed between Rachmaninoff and Zverev, now his adviser, after Zverev turned down the composer's request for assistance in renting a piano and greater privacy to compose.
            - superscript [ref=e261]:
              - link "[29]" [ref=e262] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage33mode2up_33]-32"
            - superscript [ref=e263]:
              - link "[30]" [ref=e264] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEScott2011[httpsarchiveorgdetailsrachmaninoff0000scotpage25mode2up_25]-33"
            - text: Zverev, who believed composition was a waste for talented pianists, refused to speak to Rachmaninoff for some time and arranged for him to live with the Satin family (Rachmaninoff's aunt, uncle, and their children) in Moscow.
            - superscript [ref=e265]:
              - link "[31]" [ref=e266] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage35mode2up_35]-34"
            - text: Rachmaninoff then found his first romance in Vera, the youngest daughter of the neighbouring Skalon family, but her mother objected and forbade Rachmaninoff to write to her, leaving him to correspond with her older sister Natalia.
            - superscript [ref=e267]:
              - link "[32]" [ref=e268] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage27mode2up_27]-35"
            - text: It is from these letters that many of Rachmaninoff's
            - link "earliest compositions" [ref=e269] [cursor=pointer]:
              - /url: /wiki/Miscellaneous_solo_piano_compositions_(Rachmaninoff)
            - text: can be traced.
            - superscript [ref=e270]:
              - link "[22]" [ref=e271] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage46mode2up_46]-25"
          - figure "Ivanovka was the ideal location for Rachmaninoff to compose." [ref=e272]:
            - link [ref=e273] [cursor=pointer]:
              - /url: /wiki/File:Ivanovka_yard.jpg
              - img [ref=e274]
            - generic [ref=e275]: Ivanovka was the ideal location for Rachmaninoff to compose.
          - paragraph [ref=e276]:
            - text: Rachmaninoff spent his summer break in 1890 with the Satins at
            - link "Ivanovka" [ref=e277] [cursor=pointer]:
              - /url: /wiki/Ivanovka_estate
            - text: ", their private country estate near"
            - link "Tambov" [ref=e278] [cursor=pointer]:
              - /url: /wiki/Tambov
            - text: ", to which the composer would return many times until 1917."
            - superscript [ref=e279]:
              - link "[33]" [ref=e280] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage26mode2up_26]-36"
            - text: The peaceful and bucolic surroundings became a source of inspiration for the composer, who completed many compositions while at the estate, including his
            - link "Op." [ref=e281] [cursor=pointer]:
              - /url: /wiki/Opus_number
            - text: 1,
            - link "Piano Concerto No. 1" [ref=e282] [cursor=pointer]:
              - /url: /wiki/Piano_Concerto_No._1_(Rachmaninoff)
            - text: ", which he completed in July 1891, and dedicated to Siloti."
            - superscript [ref=e283]:
              - link "[34]" [ref=e284] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990[httpsbooksgooglecombooksid_zkrDwAAQBAJpgPA48_48]-37"
            - superscript [ref=e285]:
              - link "[35]" [ref=e286] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESylvester2014[httpsbooksgooglecombooksidt3rDAgAAQBAJpgPA8_8]-38"
            - text: Also that year, Rachmaninoff completed the one-movement
            - link "Youth Symphony" [ref=e288] [cursor=pointer]:
              - /url: /wiki/Youth_Symphony_(Rachmaninoff)
            - text: and the symphonic poem
            - link "Prince Rostislav" [ref=e290] [cursor=pointer]:
              - /url: /wiki/Prince_Rostislav_(Rachmaninoff)
            - text: .
            - superscript [ref=e291]:
              - link "[36]" [ref=e292] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage33mode2up_33–35]-39"
            - text: Siloti left the Moscow Conservatory after the academic year ended in 1891 and Rachmaninoff asked to take his final piano exams a year early to avoid being assigned a different teacher. Despite little faith from Siloti and Conservatory director
            - link "Vasily Safonov" [ref=e293] [cursor=pointer]:
              - /url: /wiki/Vasily_Safonov
            - text: as he had just three weeks' preparation, Rachmaninoff received assistance from a recent graduate who was familiar with the tests, and passed each one with honours in July 1891. Three days later, he passed his annual theory and composition exams.
            - superscript [ref=e294]:
              - link "[37]" [ref=e295] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage30mode2up_30]-40"
            - text: His progress was unexpectedly halted in the latter half of 1891 when he contracted a severe case of
            - link "malaria" [ref=e296] [cursor=pointer]:
              - /url: /wiki/Malaria
            - text: during his summer break at Ivanovka.
            - superscript [ref=e297]:
              - link "[38]" [ref=e298] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage41mode2up_41]-41"
            - superscript [ref=e299]:
              - link "[39]" [ref=e300] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTERiesemann1934[httpsarchiveorgdetailsinernetdli2015179919pagen91mode2up_75]-42"
          - paragraph [ref=e301]:
            - text: During his final year at the Conservatory, Rachmaninoff performed his first independent concert, where he premiered his
            - link "Trio élégiaque No. 1" [ref=e302] [cursor=pointer]:
              - /url: /wiki/Trio_%C3%A9l%C3%A9giaque_No._1_(Rachmaninoff)
            - text: in January 1892, followed by a performance of the first movement of his Piano Concerto No. 1 two months later.
            - superscript [ref=e303]:
              - link "[40]" [ref=e304] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage11mode2up_11&ndash;12]-43"
            - superscript [ref=e305]:
              - link "[41]" [ref=e306] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEScott2011[httpsarchiveorgdetailsrachmaninoff0000scotpage34mode2up_34]-44"
            - text: His request to take his final theory and composition exams a year early was also granted, for which he wrote
            - link "Aleko" [ref=e308] [cursor=pointer]:
              - /url: /wiki/Aleko_(Rachmaninoff)
            - text: ", a one-act opera based on the narrative poem The Gypsies by"
            - link "Alexander Pushkin" [ref=e309] [cursor=pointer]:
              - /url: /wiki/Alexander_Pushkin
            - text: ", in seventeen days."
            - superscript [ref=e310]:
              - link "[42]" [ref=e311] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage74mode2up_75]-45"
            - superscript [ref=e312]:
              - link "[35]" [ref=e313] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESylvester2014[httpsbooksgooglecombooksidt3rDAgAAQBAJpgPA8_8]-38"
            - text: It premiered in May 1892 at the
            - link "Bolshoi Theatre" [ref=e314] [cursor=pointer]:
              - /url: /wiki/Bolshoi_Theatre
            - text: ; Tchaikovsky attended and praised Rachmaninoff for his work.
            - superscript [ref=e315]:
              - link "[43]" [ref=e316] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage83mode2up_83–85]-46"
            - text: Rachmaninoff believed it was "sure to fail", but the production was so successful the theatre agreed to produce it starring singer
            - link "Feodor Chaliapin" [ref=e317] [cursor=pointer]:
              - /url: /wiki/Feodor_Chaliapin
            - text: ", who would go on to become a lifelong friend."
            - superscript [ref=e318]:
              - link "[44]" [ref=e319] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage84mode2up_84–85]-47"
            - superscript [ref=e320]:
              - link "[22]" [ref=e321] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage46mode2up_46]-25"
            - text: Aleko earned Rachmaninoff the highest mark at the Conservatory and a Great Gold Medal, a distinction only previously awarded to Taneyev and
            - link "Arseny Koreshchenko" [ref=e322] [cursor=pointer]:
              - /url: /wiki/Arseny_Koreshchenko
            - text: .
            - superscript [ref=e323]:
              - link "[22]" [ref=e324] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage46mode2up_46]-25"
            - text: Zverev, a member of the exam committee, gave the composer his gold watch, thus ending years of estrangement.
            - superscript [ref=e325]:
              - link "[45]" [ref=e326] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTECunningham2001[httpsbooksgooglecombooksidk2YrwE8GaLECpgPA3_3]-48"
            - text: On 29 May 1892, at age nineteen, Rachmaninoff graduated from the Conservatory with highest honors in both composition and piano, and was issued a diploma which allowed him to officially style himself as a "Free Artist".
            - superscript [ref=e327]:
              - link "[46]" [ref=e328] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage43mode2up_43]-49"
          - figure "Sergei Rachmaninoff circa 1900" [ref=e329]:
            - link [ref=e330] [cursor=pointer]:
              - /url: /wiki/File:Rachmaninov.jpg
              - img [ref=e331]
            - generic [ref=e332]: Sergei Rachmaninoff circa 1900
          - paragraph [ref=e333]:
            - text: After graduating, Rachmaninoff continued to compose and signed a publishing contract with Gutheil for 500
            - link "rubles" [ref=e334] [cursor=pointer]:
              - /url: /wiki/Russian_ruble
            - text: . This agreement led to the publication of several of his early works, including "Aleko," "Two Pieces" (Op. 2), and "Six Songs" (Op. 4).
            - superscript [ref=e335]:
              - link "[45]" [ref=e336] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTECunningham2001[httpsbooksgooglecombooksidk2YrwE8GaLECpgPA3_3]-48"
            - text: Before this, he had earned 15 rubles per month by giving piano lessons at a girls' school.
            - superscript [ref=e337]:
              - link "[47]" [ref=e338] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage82mode2up_82]-50"
            - text: Rachmaninoff spent the summer of 1892 on the estate of Ivan Konavalov, a rich landowner in the
            - link "Kostroma Oblast" [ref=e339] [cursor=pointer]:
              - /url: /wiki/Kostroma_Oblast
            - text: ", and moved back with the Satins in the"
            - link "Arbat District" [ref=e340] [cursor=pointer]:
              - /url: /wiki/Arbat_District
            - text: .
            - superscript [ref=e341]:
              - link "[48]" [ref=e342] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage47mode2up_47]-51"
            - text: Delays in getting paid by Gutheil saw Rachmaninoff seeking other sources of income, which led to an engagement at the Moscow Electrical Exhibition in September 1892, his public debut as a pianist, where he premiered his landmark
            - link "Prelude in C-sharp minor" [ref=e343] [cursor=pointer]:
              - /url: /wiki/Prelude_in_C-sharp_minor_(Rachmaninoff)
            - text: from his five-part piano composition piece
            - link "Morceaux de fantaisie" [ref=e345] [cursor=pointer]:
              - /url: /wiki/Morceaux_de_fantaisie
            - text: (Op. 3). He was paid 50 rubles for his appearance.
            - superscript [ref=e346]:
              - link "[49]" [ref=e347] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage86mode2up_86]-52"
            - superscript [ref=e348]:
              - link "[45]" [ref=e349] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTECunningham2001[httpsbooksgooglecombooksidk2YrwE8GaLECpgPA3_3]-48"
            - text: It was well received and became one of his most popular and enduring pieces.
            - superscript [ref=e350]:
              - link "[50]" [ref=e351] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990[httpsbooksgooglecombooksid_zkrDwAAQBAJpgPA69_69]-53"
            - superscript [ref=e352]:
              - link "[51]" [ref=e353] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEScott2011[httpsarchiveorgdetailsrachmaninoff0000scotpage37mode2up_37]-54"
            - text: In 1893, he completed his tone poem
            - link "The Rock" [ref=e355] [cursor=pointer]:
              - /url: /wiki/The_Rock_(Rachmaninoff)
            - text: ", which he dedicated to Rimsky-Korsakov."
            - superscript [ref=e356]:
              - link "[52]" [ref=e357] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage406mode2up_406]-55"
          - paragraph [ref=e358]:
            - text: In 1893, Rachmaninoff spent a productive summer with friends at an estate in
            - link "Kharkov Governorate" [ref=e359] [cursor=pointer]:
              - /url: /wiki/Kharkov_Governorate
            - text: where he composed several pieces, including
            - link "Fantaisie-Tableaux" [ref=e360] [cursor=pointer]:
              - /url: /wiki/Suite_No._1_(Rachmaninoff)
            - text: (aka Suite No. 1, Op. 5) and
            - link "Morceaux de salon" [ref=e362] [cursor=pointer]:
              - /url: /wiki/Morceaux_de_salon,_Op._10_(Rachmaninoff)
            - text: (Op. 10).
            - superscript [ref=e363]:
              - link "[53]" [ref=e364] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESylvester2014[httpsbooksgooglecombooksidt3rDAgAAQBAJpgPA30_30]-56"
            - superscript [ref=e365]:
              - link "[54]" [ref=e366] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEThrelfallNorris198245-57"
            - text: In September, he published Six Songs (Op. 8), a group of songs set to translations by
            - link "Aleksey Pleshcheyev" [ref=e367] [cursor=pointer]:
              - /url: /wiki/Aleksey_Pleshcheyev
            - text: of Ukrainian and German poems.
            - superscript [ref=e368]:
              - link "[55]" [ref=e369] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage61mode2up_61]-58"
            - text: Rachmaninoff returned to Moscow, where Tchaikovsky agreed to conduct The Rock for an upcoming European tour. During his subsequent trip to
            - link "Kiev" [ref=e370] [cursor=pointer]:
              - /url: /wiki/Kiev
            - text: to conduct performances of Aleko, he learned of
            - link "Tchaikovsky's death" [ref=e371] [cursor=pointer]:
              - /url: /wiki/Death_of_Pyotr_Ilyich_Tchaikovsky
            - text: from
            - link "cholera" [ref=e372] [cursor=pointer]:
              - /url: /wiki/Cholera
            - text: .
            - superscript [ref=e373]:
              - link "[56]" [ref=e374] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage62mode2up_62]-59"
            - text: The news left Rachmaninoff stunned; later that day, he started work on his
            - link "Trio élégiaque No. 2" [ref=e375] [cursor=pointer]:
              - /url: /wiki/Trio_%C3%A9l%C3%A9giaque_No._2_(Rachmaninoff)
            - text: for piano, violin and cello as a tribute, which he completed within a month.
            - superscript [ref=e376]:
              - link "[57]" [ref=e377] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage91mode2up_91]-60"
            - superscript [ref=e378]:
              - link "[58]" [ref=e379] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage63mode2up_63]-61"
            - text: The music's aura of gloom reveals the depth and sincerity of Rachmaninoff's grief for his idol.
            - superscript [ref=e380]:
              - link "[59]" [ref=e381] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001b[httpsarchiveorgdetailsnewgrovedictiona0020unsepage709mode2up_709]-62"
            - text: The piece debuted at the first concert devoted to Rachmaninoff's compositions on 31 January 1894.
            - superscript [ref=e382]:
              - link "[58]" [ref=e383] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage63mode2up_63]-61"
          - generic [ref=e384]:
            - 'heading "1894–1900: Symphony No. 1, depression, and conducting debut" [level=3] [ref=e385]': "1894–1900: Symphony No. 1, depression, and conducting debut"
            - generic [ref=e386]:
              - text: "["
              - link "edit" [ref=e387] [cursor=pointer]:
                - /url: /w/index.php?title=Sergei_Rachmaninoff&action=edit&section=4
              - text: "]"
          - paragraph [ref=e388]:
            - text: Rachmaninoff entered a decline following Tchaikovsky's death. He lacked the inspiration to compose, and the management of the Grand Theatre had lost interest in showcasing Aleko and dropped it from the program.
            - superscript [ref=e389]:
              - link "[60]" [ref=e390] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage92mode2up_92]-63"
            - text: To earn more money, Rachmaninoff returned to giving piano lessons—which he hated
            - superscript [ref=e391]:
              - link "[61]" [ref=e392] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage93mode2up_93]-64"
            - text: —and in late 1895, agreed to a three-month tour across Russia with a program shared by Italian violinist
            - link "Teresina Tua" [ref=e393] [cursor=pointer]:
              - /url: /wiki/Teresina_Tua
            - text: . The tour was not enjoyable for the composer and he quit before it ended, thus sacrificing his performance fees. In a more desperate plea for money, Rachmaninoff pawned his gold watch given to him by Zverev.
            - superscript [ref=e394]:
              - link "[62]" [ref=e395] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage66mode2up_67]-65"
            - text: In September 1895, before the tour started, Rachmaninoff completed his
            - link "Symphony No. 1" [ref=e396] [cursor=pointer]:
              - /url: /wiki/Symphony_No._1_(Rachmaninoff)
            - text: (Op. 13), a work conceived in January and based on chants he had heard in Russian Orthodox church services.
            - superscript [ref=e397]:
              - link "[62]" [ref=e398] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage66mode2up_67]-65"
            - text: Rachmaninoff had worked so hard on it that he could not return to composition until he heard the piece performed.
            - superscript [ref=e399]:
              - link "[63]" [ref=e400] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage69mode2up_69]-66"
            - text: This lasted until October 1896, when "a rather large sum of money" that did not belong to Rachmaninoff and was in his possession, was stolen during a train journey and he had to work to recoup the losses. Among the pieces composed were Six Choruses (Op. 15) and
            - link "Six moments musicaux" [ref=e402] [cursor=pointer]:
              - /url: /wiki/Six_moments_musicaux_(Rachmaninoff)
            - text: (Op. 16), his final completed composition for several months.
            - superscript [ref=e403]:
              - link "[64]" [ref=e404] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage70mode2up_70]-67"
          - figure "Rachmaninoff in 1897, the year his Symphony No. 1 premiered" [ref=e405]:
            - link [ref=e406] [cursor=pointer]:
              - /url: /wiki/File:Rachmaninoff_and_Skalon_sisters_crop.jpg
              - img [ref=e407]
            - generic [ref=e408]:
              - text: Rachmaninoff in 1897, the year his
              - link "Symphony No. 1" [ref=e409] [cursor=pointer]:
                - /url: /wiki/Symphony_No._1_(Rachmaninoff)
              - text: premiered
          - paragraph [ref=e410]:
            - text: Rachmaninoff's fortunes took a turn following the premiere of his Symphony No. 1 on 28 March 1897 in one of a long-running series of
            - link "Russian Symphony Concerts" [ref=e411] [cursor=pointer]:
              - /url: /wiki/Russian_Symphony_Concerts
            - text: devoted to Russian music. The piece was brutally panned by critic and nationalist composer
            - link "César Cui" [ref=e412] [cursor=pointer]:
              - /url: /wiki/C%C3%A9sar_Cui
            - text: ", who likened it to a depiction of the"
            - link "seven plagues of Egypt" [ref=e413] [cursor=pointer]:
              - /url: /wiki/Plagues_of_Egypt
            - text: ", suggesting it would be admired by the \"inmates\" of a music conservatory in Hell."
            - superscript [ref=e414]:
              - link "[65]" [ref=e415] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEScott2011[httpsarchiveorgdetailsrachmaninoff0000scotpage48mode2up_48]-68"
            - text: The deficiencies of the performance, conducted by
            - link "Alexander Glazunov" [ref=e416] [cursor=pointer]:
              - /url: /wiki/Alexander_Glazunov
            - text: ", were not commented on by other critics,"
            - superscript [ref=e417]:
              - link "[59]" [ref=e418] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001b[httpsarchiveorgdetailsnewgrovedictiona0020unsepage709mode2up_709]-62"
            - text: but according to a memoir from
            - link "Alexander Ossovsky" [ref=e419] [cursor=pointer]:
              - /url: /wiki/Alexander_Ossovsky
            - text: ", a close friend of Rachmaninoff, Glazunov made poor use of rehearsal time, and the concert's program itself, which contained two other premières, was also a factor. Other witnesses, including Rachmaninoff's wife, suggested that Glazunov, an alcoholic, may have been drunk."
            - superscript [ref=e420]:
              - link "[66]" [ref=e421] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage77mode2up_77]-69"
            - superscript [ref=e422]:
              - link "[67]" [ref=e423] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage23mode2up_23]-70"
            - superscript [ref=e424]:
              - link "[68]" [ref=e425] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEPiggott1974[httpsarchiveorgdetailsrachmaninovorche0000piggpage24mode2up_24]-71"
            - text: Following the reaction to his first symphony, Rachmaninoff wrote in May 1897 that "I'm not at all affected" by its lack of success or critical reaction, but felt "deeply distressed and heavily depressed by the fact that my Symphony ... did not please me at all after its first rehearsal".
            - superscript [ref=e426]:
              - link "[69]" [ref=e427] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage73mode2up_73]-72"
            - text: He thought its performance was poor, particularly Glazunov's contribution.
            - superscript [ref=e428]:
              - link "[67]" [ref=e429] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage23mode2up_23]-70"
            - text: The piece was not performed for the rest of Rachmaninoff's life, but he revised it into a four-hand piano arrangement in 1898.
            - superscript [ref=e430]:
              - link "[70]" [ref=e431] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage74mode2up_74]-73"
          - paragraph [ref=e432]:
            - text: Rachmaninoff experienced a depression that lasted three years, during which he struggled with
            - link "writer's block" [ref=e433] [cursor=pointer]:
              - /url: /wiki/Writer%27s_block
            - text: and composed very little music. He described this period as being "like a man who had suffered a stroke and for a long time had lost the use of his head and hands."
            - superscript [ref=e434]:
              - link "[70]" [ref=e435] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage74mode2up_74]-73"
            - text: To support himself, he gave piano lessons.
            - superscript [ref=e436]:
              - link "[71]" [ref=e437] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage76mode2up_76]-74"
            - text: A stroke of good fortune came from
            - link "Savva Mamontov" [ref=e438] [cursor=pointer]:
              - /url: /wiki/Savva_Mamontov
            - text: ", a Russian industrialist and founder of the"
            - link "Moscow Private Russian Opera" [ref=e439] [cursor=pointer]:
              - /url: /wiki/Moscow_Private_Russian_Opera
            - text: ", who offered Rachmaninoff the post of assistant conductor for the 1897–98 season. The cash-strapped composer accepted, conducting"
            - link "Samson and Delilah" [ref=e441] [cursor=pointer]:
              - /url: /wiki/Samson_and_Delilah_(opera)
            - text: by
            - link "Camille Saint-Saëns" [ref=e442] [cursor=pointer]:
              - /url: /wiki/Camille_Saint-Sa%C3%ABns
            - text: as his first opera on 12 October 1897.
            - superscript [ref=e443]:
              - link "[72]" [ref=e444] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage77mode2up_77]-75"
            - text: By the end of February 1899, Rachmaninoff attempted composition and completed two short piano pieces, Morceau de Fantaisie and Fughetta in F major. Two months later, he travelled to London for the first time to perform and conduct, earning positive reviews.
            - superscript [ref=e445]:
              - link "[73]" [ref=e446] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage84mode2up_84],_[httpsarchiveorgdetailssergeirachmanino0000bertpage87mode2up_87]-76"
            - text: In late 1899, however, his depression worsened following an unproductive summer; he composed one song, "Fate", which later became one of his Twelve Songs (Op. 21), and left compositions for a proposed return visit to London unfulfilled.
            - superscript [ref=e447]:
              - link "[74]" [ref=e448] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage88mode2up_88]-77"
            - text: In an attempt to revive his desire to compose, his aunt arranged for the writer
            - link "Leo Tolstoy" [ref=e449] [cursor=pointer]:
              - /url: /wiki/Leo_Tolstoy
            - text: ", whom Rachmaninoff greatly admired, to have the composer visit his home and receive words of encouragement. The visit was unsuccessful, doing nothing to help him compose with the fluency he had before."
            - superscript [ref=e450]:
              - link "[75]" [ref=e451] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage88mode2up_88–89]-78"
            - superscript [ref=e452]:
              - link "[76]" [ref=e453] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTERiesemann1934[httpsarchiveorgdetailsinernetdli2015179919pagen129mode2up_111]-79"
          - generic [ref=e454]:
            - 'heading "1900–1906: Recovery, emergence, and conducting" [level=3] [ref=e455]': "1900–1906: Recovery, emergence, and conducting"
            - generic [ref=e456]:
              - text: "["
              - link "edit" [ref=e457] [cursor=pointer]:
                - /url: /w/index.php?title=Sergei_Rachmaninoff&action=edit&section=5
              - text: "]"
          - figure "Rachmaninoff in the early 1900s" [ref=e458]:
            - link [ref=e459] [cursor=pointer]:
              - /url: /wiki/File:Rachmaninoff_1900.jpg
              - img [ref=e460]
            - generic [ref=e461]: Rachmaninoff in the early 1900s
          - paragraph [ref=e462]:
            - text: After his devastating experience with Leo Tolstoy, his aunt suggested professional help, having received successful treatment from a family friend, physician and amateur musician
            - link "Nikolai Dahl" [ref=e463] [cursor=pointer]:
              - /url: /wiki/Nikolai_Dahl
            - text: ", to which Rachmaninoff agreed without resistance."
            - superscript [ref=e464]:
              - link "[77]" [ref=e465] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage89mode2up_89],_[httpsarchiveorgdetailssergeirachmanino0000bertpage90mode2up_90]-80"
            - text: Between January and April 1900, Rachmaninoff underwent
            - link "hypnotherapy" [ref=e466] [cursor=pointer]:
              - /url: /wiki/Hypnotherapy
            - text: and supportive therapy sessions with Dahl on a daily basis for over 3 months,
            - superscript [ref=e467]:
              - link "[78]" [ref=e468] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990[httpsbooksgooglecombooksid_zkrDwAAQBAJpgPA124_124]-81"
            - text: specifically structured to improve his sleep patterns, mood, and appetite and reignite his desire to compose. That summer, Rachmaninoff felt that "new musical ideas began to stir" and successfully resumed composition.
            - superscript [ref=e469]:
              - link "[79]" [ref=e470] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage90mode2up_90]-82"
          - paragraph [ref=e471]:
            - text: In July 1900, Rachmaninoff finally composed the "Love Duet," a key scene in the opera
            - link "Francesca da Rimini" [ref=e472] [cursor=pointer]:
              - /url: /wiki/Francesca_da_Rimini_(Rachmaninoff)
            - text: ", which was to be completed in 1906. This song was written earlier than his"
            - link "Piano Concerto No.2" [ref=e473] [cursor=pointer]:
              - /url: /wiki/Piano_Concerto_No._2_(Rachmaninoff)
            - text: ", and the \"Love Duet\" became an important work that marked Rachmaninoff's rebirth as a composer."
            - superscript [ref=e474]:
              - link "[80]" [ref=e475] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEYuki_Ito2023107-83"
          - paragraph [ref=e476]:
            - text: That autumn he began working on the
            - link "Piano Concerto No. 2" [ref=e477] [cursor=pointer]:
              - /url: /wiki/Piano_Concerto_No._2_(Rachmaninoff)
            - text: ", which was finished in April 1901; it is dedicated to Dahl. After the second and third movement premiered in December 1900 with Rachmaninoff as the soloist, the entire piece was first performed in 1901 and was enthusiastically received."
            - superscript [ref=e478]:
              - link "[81]" [ref=e479] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage90mode2up_90],_[httpsarchiveorgdetailssergeirachmanino0000bertpage95mode2up_95]-84"
            - text: The piece earned the composer a
            - link "Glinka Award" [ref=e480] [cursor=pointer]:
              - /url: /wiki/Mikhail_Glinka#Legacy
            - text: ", the first of five awarded to him throughout his life, and a 500-ruble prize in 1904."
            - superscript [ref=e481]:
              - link "[82]" [ref=e482] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTERiesemann1934[httpsarchiveorgdetailsinernetdli2015179919pagen271mode2up_242]-85"
          - paragraph [ref=e483]:
            - text: By the end of 1901, the
            - link "Cello Sonata" [ref=e484] [cursor=pointer]:
              - /url: /wiki/Cello_Sonata_(Rachmaninoff)
            - text: was completed (first draft November 20, premiere December 2, revised version December 12).
            - superscript [ref=e485]:
              - link "[83]" [ref=e486] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEYuki_Ito2023119-86"
          - paragraph [ref=e487]:
            - text: Amid his professional career success, Rachmaninoff married Natalia Satina on 12 May 1902 after a three-year engagement.
            - superscript [ref=e488]:
              - link "[84]" [ref=e489] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage103mode2up_103]-87"
            - text: Because they were first cousins, the marriage was forbidden under a
            - link "Canon law" [ref=e490] [cursor=pointer]:
              - /url: /wiki/Canon_law
            - text: imposed by the Russian Orthodox Church; in addition, Rachmaninoff was not a regular church attendee and avoided confession, two things a priest would have had to confirm that he did in signing a marriage certificate.
            - superscript [ref=e491]:
              - link "[85]" [ref=e492] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage97mode2up_97]-88"
            - text: To circumvent the church's opposition, the couple used their military background and organised a small ceremony in a chapel in a Moscow suburb army barracks with Siloti and the cellist
            - link "Anatoliy Brandukov" [ref=e493] [cursor=pointer]:
              - /url: /wiki/Anatoliy_Brandukov
            - text: as best men.
            - superscript [ref=e494]:
              - link "[86]" [ref=e495] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESylvester2014[httpsbooksgooglecombooksidt3rDAgAAQBAJpgPA94_94]-89"
            - superscript [ref=e496]:
              - link "[87]" [ref=e497] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage115mode2up_115]-90"
            - text: They received the smaller of two houses at the Ivanovka estate as a present and went on a three-month honeymoon across Europe.
            - superscript [ref=e498]:
              - link "[84]" [ref=e499] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage103mode2up_103]-87"
            - text: Upon their return, they settled in Moscow, where Rachmaninoff resumed work as a music teacher at St. Catherine's Women's College and the Elizabeth Institute.
            - superscript [ref=e500]:
              - link "[88]" [ref=e501] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage110mode2up_110]-91"
            - text: By February 1903 he had completed his largest piano composition of his career at the time, the
            - link "Variations on a Theme of Chopin" [ref=e503] [cursor=pointer]:
              - /url: /wiki/Variations_on_a_Theme_of_Chopin_(Rachmaninoff)
            - text: (Op. 22).
            - superscript [ref=e504]:
              - link "[88]" [ref=e505] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage110mode2up_110]-91"
            - text: On 14 May 1903, the couple's first daughter, Irina Sergeyevna Rachmaninova, was born.
            - superscript [ref=e506]:
              - link "[89]" [ref=e507] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage101mode2up_101]-92"
            - text: During their summer break at Ivanovka, the family was struck with illness.
            - superscript [ref=e508]:
              - link "[90]" [ref=e509] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage113mode2up_113]-93"
          - figure "The Bolshoi Theatre in 1905, during Rachmaninoff's time as conductor" [ref=e510]:
            - link [ref=e511] [cursor=pointer]:
              - /url: /wiki/File:Bolshoi_Theatre_1905.jpg
              - img [ref=e512]
            - generic [ref=e513]:
              - text: The
              - link "Bolshoi Theatre" [ref=e514] [cursor=pointer]:
                - /url: /wiki/Bolshoi_Theatre
              - text: in 1905, during Rachmaninoff's time as conductor
          - paragraph [ref=e515]:
            - text: In 1904, in a career change, Rachmaninoff agreed to become the conductor at the Bolshoi Theatre for two seasons. He earned a mixed reputation during his time at the post, enforcing strict discipline and demanding high standards of performance.
            - superscript [ref=e516]:
              - link "[91]" [ref=e517] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage113mode2up_113–114]-94"
            - text: Influenced by
            - link "Richard Wagner" [ref=e518] [cursor=pointer]:
              - /url: /wiki/Richard_Wagner
            - text: ", he pioneered the modern arrangement of the orchestra players in the pit and the modern custom of standing while conducting. He also worked with each soloist on their part, even accompanying them on the piano."
            - superscript [ref=e519]:
              - link "[92]" [ref=e520] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage90mode2up_90]-95"
            - text: The theatre staged the premiere of his operas
            - link "The Miserly Knight" [ref=e522] [cursor=pointer]:
              - /url: /wiki/The_Miserly_Knight
            - text: and
            - link "Francesca da Rimini" [ref=e524] [cursor=pointer]:
              - /url: /wiki/Francesca_da_Rimini_(Rachmaninoff)
            - text: .
            - superscript [ref=e525]:
              - link "[93]" [ref=e526] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage102mode2up_102]-96"
          - paragraph [ref=e527]:
            - text: In the course of his second season as conductor, Rachmaninoff lost interest in his post. The social and political unrest surrounding the
            - link "1905 Revolution" [ref=e528] [cursor=pointer]:
              - /url: /wiki/Revolution_of_1905
            - text: was beginning to affect the performers and theatre staff, who staged protests and demands for improved wages and conditions. Rachmaninoff remained largely uninterested in the politics surrounding him and the revolutionary spirit had made working conditions increasingly difficult.
            - superscript [ref=e529]:
              - link "[94]" [ref=e530] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage92mode2up_92–93],_[httpsarchiveorgdetailsrachmaninoff00seropage96mode2up_96]-97"
            - text: In February 1906, after conducting 50 performances in the first season and 39 in the second, Rachmaninoff handed in his resignation.
            - superscript [ref=e531]:
              - link "[95]" [ref=e532] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage114mode2up_114]-98"
            - text: He then took his family on an extended tour around Italy with the hope of completing new works, but illness struck his wife and daughter, and they returned to Ivanovka.
            - superscript [ref=e533]:
              - link "[96]" [ref=e534] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage127mode2up_127]-99"
            - text: Money soon became an issue following Rachmaninoff's resignation from his posts at St. Catherine's and Elizabeth schools, leaving him only the option of composing.
            - superscript [ref=e535]:
              - link "[97]" [ref=e536] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage92mode2up_92–93],_[httpsarchiveorgdetailsrachmaninoff00seropage96mode2up_96],_[httpsarchiveorgdetailsrachmaninoff00seropage107mode2up_107]-100"
          - generic [ref=e537]:
            - 'heading "1906–1917: Move to Dresden and first US tour" [level=3] [ref=e538]': "1906–1917: Move to Dresden and first US tour"
            - generic [ref=e539]:
              - text: "["
              - link "edit" [ref=e540] [cursor=pointer]:
                - /url: /w/index.php?title=Sergei_Rachmaninoff&action=edit&section=6
              - text: "]"
          - paragraph [ref=e541]:
            - text: Increasingly unhappy with the political turmoil in Russia and in need of seclusion from his lively social life to be able to compose, Rachmaninoff with his family left Moscow for
            - link "Dresden" [ref=e542] [cursor=pointer]:
              - /url: /wiki/Dresden
            - text: ", Germany, in November 1906."
            - superscript [ref=e543]:
              - link "[98]" [ref=e544] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage128mode2up_128–129]-101"
            - text: The city had become a favourite of both Rachmaninoff and Natalia, and they stayed there until 1909, only returning to Russia for their summer breaks at Ivanovka.
            - superscript [ref=e545]:
              - link "[99]" [ref=e546] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage108mode2up_108]-102"
            - text: In
            - link "Paris" [ref=e547] [cursor=pointer]:
              - /url: /wiki/Paris
            - text: ", during the summer of 1907, he saw a black and white reproduction of"
            - link "The Isle of the Dead" [ref=e549] [cursor=pointer]:
              - /url: /wiki/The_Isle_of_the_Dead_(painting)
            - text: by
            - link "Arnold Böcklin" [ref=e550] [cursor=pointer]:
              - /url: /wiki/Arnold_B%C3%B6cklin
            - text: ", which served as the inspiration for his"
            - link "orchestral work of the same name" [ref=e551] [cursor=pointer]:
              - /url: /wiki/Isle_of_the_Dead_(Rachmaninoff)
            - text: ", Op. 29."
            - superscript [ref=e552]:
              - link "[100]" [ref=e553] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage156mode2up_156]-103"
            - text: Despite occasional periods of depression, apathy, and little faith in any of his work,
            - superscript [ref=e554]:
              - link "[101]" [ref=e555] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage112mode2up_112],_[httpsarchiveorgdetailsrachmaninoff00seropage114mode2up_114]-104"
            - text: Rachmaninoff started on his
            - link "Symphony No. 2" [ref=e556] [cursor=pointer]:
              - /url: /wiki/Symphony_No._2_(Rachmaninoff)
            - text: (Op. 27) in 1906, twelve years after the disastrous premiere of his first.
            - superscript [ref=e557]:
              - link "[102]" [ref=e558] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage115mode2up_115]-105"
            - text: While writing it, Rachmaninoff and the family returned to Russia, but the composer detoured to Paris to take part in
            - link "Sergei Diaghilev" [ref=e559] [cursor=pointer]:
              - /url: /wiki/Sergei_Diaghilev
            - text: "'s season of Russian concerts in May 1907. His performance as the soloist in his Piano Concerto No. 2 with an encore of his Prelude in C-sharp minor was a triumphant success."
            - superscript [ref=e560]:
              - link "[103]" [ref=e561] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage118mode2up_118–119]-106"
            - text: Rachmaninoff regained his sense of self-worth following the enthusiastic reaction to the premiere of his Symphony No. 2 in early 1908, which earned him his second Glinka Award and 1,000 roubles.
            - superscript [ref=e562]:
              - link "[104]" [ref=e563] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage148mode2up_148–149]-107"
          - figure "Rachmaninoff proofing his Piano Concerto No. 3 at the Ivanovka estate, 1910" [ref=e564]:
            - link [ref=e565] [cursor=pointer]:
              - /url: /wiki/File:Rachmaninoff_proofing.jpg
              - img [ref=e566]
            - generic [ref=e567]:
              - text: Rachmaninoff proofing his
              - link "Piano Concerto No. 3" [ref=e568] [cursor=pointer]:
                - /url: /wiki/Piano_Concerto_No._3_(Rachmaninoff)
              - text: at the
              - link "Ivanovka estate" [ref=e569] [cursor=pointer]:
                - /url: /wiki/Ivanovka_estate
              - text: ", 1910"
          - paragraph [ref=e570]:
            - text: While in Dresden, Rachmaninoff agreed to perform and conduct in the United States as part of the 1909–10 concert season with conductor
            - link "Max Fiedler" [ref=e571] [cursor=pointer]:
              - /url: /wiki/Max_Fiedler
            - text: and the
            - link "Boston Symphony Orchestra" [ref=e572] [cursor=pointer]:
              - /url: /wiki/Boston_Symphony_Orchestra
            - text: .
            - superscript [ref=e573]:
              - link "[105]" [ref=e574] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage135mode2up_135],_[httpsarchiveorgdetailsrachmaninoffbiog00lylepage142mode2up_142]-108"
            - text: He spent time during breaks at Ivanovka finishing a new piece specially for the visit, his
            - link "Piano Concerto No. 3" [ref=e575] [cursor=pointer]:
              - /url: /wiki/Piano_Concerto_No._3_(Rachmaninoff)
            - text: ", Op. 30, which he dedicated to"
            - link "Josef Hofmann" [ref=e576] [cursor=pointer]:
              - /url: /wiki/Josef_Hofmann
            - text: .
            - superscript [ref=e577]:
              - link "[106]" [ref=e578] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage138mode2up_138]-109"
            - text: The tour saw the composer make 26 performances, 19 as pianist and 7 as conductor, which marked his first recitals without another performer in the program. His first appearance was at
            - link "Smith College" [ref=e579] [cursor=pointer]:
              - /url: /wiki/Smith_College
            - text: in
            - link "Northampton, Massachusetts" [ref=e580] [cursor=pointer]:
              - /url: /wiki/Northampton,_Massachusetts
            - text: for a recital on 4 November 1909. The second performance of Piano Concerto No. 3 by the
            - link "New York Symphony Orchestra" [ref=e581] [cursor=pointer]:
              - /url: /wiki/New_York_Symphony_Orchestra
            - text: was conducted by
            - link "Gustav Mahler" [ref=e582] [cursor=pointer]:
              - /url: /wiki/Gustav_Mahler
            - text: in New York City with the composer as soloist, an experience he personally treasured.
            - superscript [ref=e583]:
              - link "[107]" [ref=e584] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage140mode2up_140–141]-110"
            - superscript [ref=e585]:
              - link "[108]" [ref=e586] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage160mode2up_160]-111"
            - text: Though the tour increased the composer's popularity in America, he declined subsequent offers due to the length of time away from Russia and his family.
            - superscript [ref=e587]:
              - link "[109]" [ref=e588] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage162mode2up_162]-112"
          - paragraph [ref=e589]:
            - text: Upon his return home in February 1910, Rachmaninoff became vice president of the
            - link "Imperial Russian Musical Society" [ref=e590] [cursor=pointer]:
              - /url: /wiki/Russian_Musical_Society
            - text: (IRMS), whose president was a member of the royal family.
            - superscript [ref=e591]:
              - link "[110]" [ref=e592] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage143mode2up_143]-113"
            - text: Later in 1910, Rachmaninoff completed his choral work
            - link "Liturgy of St. John Chrysostom" [ref=e594] [cursor=pointer]:
              - /url: /wiki/Liturgy_of_St._John_Chrysostom_(Rachmaninoff)
            - text: ", Op. 31, but it was banned from performance as it did not follow the format of a typical"
            - link "liturgical" [ref=e595] [cursor=pointer]:
              - /url: /wiki/Liturgy
            - text: church service.
            - superscript [ref=e596]:
              - link "[111]" [ref=e597] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage146mode2up_146]-114"
            - text: For two seasons between 1911 and 1913, Rachmaninoff was appointed permanent conductor of the Philharmonic Society of Moscow; he helped raise its profile and increase audience numbers and receipts.
            - superscript [ref=e598]:
              - link "[112]" [ref=e599] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTERiesemann1934[httpsarchiveorgdetailsinernetdli2015179919pagen189mode2up_166]-115"
            - text: In 1912, Rachmaninoff left the IRMS when he learned that a musician in an administrative post was dismissed for being Jewish.
            - superscript [ref=e600]:
              - link "[113]" [ref=e601] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage179mode2up_179]-116"
          - paragraph [ref=e602]:
            - text: Soon after his resignation, an exhausted Rachmaninoff sought time for composition and took his family on holiday to Switzerland. They left after one month for Rome for a visit that became a particularly tranquil and influential period for the composer, who lived alone in a small apartment on
            - link "Piazza di Spagna" [ref=e603] [cursor=pointer]:
              - /url: /wiki/Piazza_di_Spagna
            - text: while his family stayed at a boardinghouse.
            - superscript [ref=e604]:
              - link "[114]" [ref=e605] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage172mode2up_172]-117"
            - superscript [ref=e606]:
              - link "[115]" [ref=e607] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage149mode2up_149–150]-118"
            - text: While there he received an anonymous letter that contained a Russian translation of
            - link "Edgar Allan Poe" [ref=e608] [cursor=pointer]:
              - /url: /wiki/Edgar_Allan_Poe
            - text: "'s poem"
            - link "The Bells" [ref=e610] [cursor=pointer]:
              - /url: /wiki/The_Bells_(poem)
            - text: by
            - link "Konstantin Balmont" [ref=e611] [cursor=pointer]:
              - /url: /wiki/Konstantin_Balmont
            - text: ", which affected him greatly, and he began work on his"
            - link "choral symphony" [ref=e612] [cursor=pointer]:
              - /url: /wiki/The_Bells_(symphony)
            - text: of the same title, Op. 35, based on it.
            - superscript [ref=e613]:
              - link "[116]" [ref=e614] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage172mode2up_172–173]-119"
            - text: By 1912, Rachmaninoff's second daughter Tatiana was born, and his contemporaneous period of composition ended abruptly when both Rachmaninoff's daughters contracted serious cases of
            - link "typhoid" [ref=e615] [cursor=pointer]:
              - /url: /wiki/Typhoid
            - text: and were treated in Berlin due to their father's greater trust in German doctors. After six weeks, the Rachmaninoffs returned to their Moscow flat.
            - superscript [ref=e616]:
              - link "[117]" [ref=e617] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage174mode2up_174–175]-120"
            - text: The composer conducted The Bells at its premiere in Saint Petersburg in late 1913.
            - superscript [ref=e618]:
              - link "[118]" [ref=e619] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage152mode2up_152–153]-121"
          - paragraph [ref=e620]:
            - text: In January 1914, Rachmaninoff began a concert tour of England which was enthusiastically received.
            - superscript [ref=e621]:
              - link "[118]" [ref=e622] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage152mode2up_152–153]-121"
            - text: He was too afraid to travel alone following the death of
            - link "Raoul Pugno" [ref=e623] [cursor=pointer]:
              - /url: /wiki/Raoul_Pugno
            - text: of an unexpected
            - link "heart attack" [ref=e624] [cursor=pointer]:
              - /url: /wiki/Heart_attack
            - text: in his hotel room which left the composer wary of a similar fate.
            - superscript [ref=e625]:
              - link "[117]" [ref=e626] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage174mode2up_174–175]-120"
            - text: Following the outbreak of the
            - link "First World War" [ref=e627] [cursor=pointer]:
              - /url: /wiki/First_World_War
            - text: later that year, his position of Inspector of Music at Nobility High School for Girls put him in the group of government servants which prevented him from joining the army, yet the composer made regular charitable donations for the war effort.
            - superscript [ref=e628]:
              - link "[119]" [ref=e629] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage154mode2up_154]-122"
            - text: In 1915, Rachmaninoff completed his second major choral work,
            - link "All-Night Vigil" [ref=e631] [cursor=pointer]:
              - /url: /wiki/All-Night_Vigil_(Rachmaninoff)
            - text: (Op. 37).
            - superscript [ref=e632]:
              - link "[120]" [ref=e633] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEScott2011[httpsarchiveorgdetailsrachmaninoff0000scotpage103mode2up_103]-123"
            - text: It was received so warmly at its Moscow premiere in aid of war relief that four subsequent performances were quickly scheduled.
            - superscript [ref=e634]:
              - link "[121]" [ref=e635] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEScott2011[httpsarchiveorgdetailsrachmaninoff0000scotpage104mode2up_104]-124"
          - paragraph [ref=e636]:
            - link "Alexander Scriabin" [ref=e637] [cursor=pointer]:
              - /url: /wiki/Alexander_Scriabin
            - text: "'s death in April 1915 was a tragedy for Rachmaninoff, who went on a piano recital tour devoted to his friend's compositions to raise funds for Scriabin's financially stricken widow."
            - superscript [ref=e638]:
              - link "[122]" [ref=e639] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEScott2011[httpsarchiveorgdetailsrachmaninoff0000scotpage111mode2up_111]-125"
            - text: It marked his first public performances of works other than his own.
            - superscript [ref=e640]:
              - link "[123]" [ref=e641] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage178mode2up_178]-126"
            - text: During a vacation in
            - link "Finland" [ref=e642] [cursor=pointer]:
              - /url: /wiki/Finland
            - text: that summer, Rachmaninoff learned of Taneyev's death, a loss which affected him greatly.
            - superscript [ref=e643]:
              - link "[124]" [ref=e644] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEScott2011[httpsarchiveorgdetailsrachmaninoff0000scotpage113mode2up_113]-127"
            - text: By year's end he had finished his 14 Romances, Op. 34, closing with
            - link "Vocalise" [ref=e646] [cursor=pointer]:
              - /url: /wiki/Vocalise_(Rachmaninoff)
            - text: ","
            - superscript [ref=e647]:
              - link "[125]" [ref=e648] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage147mode2up_147]-128"
            - text: a "song without words" which became one of his most popular pieces. Cellist
            - link "Yuki Ito" [ref=e649] [cursor=pointer]:
              - /url: /wiki/Yuki_Ito_(cellist)
            - text: argued that Vocalise combines the embodiment of the spirit through music with the idea of
            - link "Russian Symbolism" [ref=e650] [cursor=pointer]:
              - /url: /wiki/Russian_Symbolism
            - text: ", which sought to free words from meaning; as is the case with many of Rachmaninoff's masterpieces, the opening alludes to the Gregorian chant \""
            - link "Dies irae" [ref=e651] [cursor=pointer]:
              - /url: /wiki/Dies_irae
            - text: "\"."
            - superscript [ref=e652]:
              - link "[126]" [ref=e653] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEYuki_Ito2023061-129"
          - generic [ref=e654]:
            - 'heading "1917–1925: Leaving Russia, emigration to the US, and concert pianist" [level=3] [ref=e655]': "1917–1925: Leaving Russia, emigration to the US, and concert pianist"
            - generic [ref=e656]:
              - text: "["
              - link "edit" [ref=e657] [cursor=pointer]:
                - /url: /w/index.php?title=Sergei_Rachmaninoff&action=edit&section=7
              - text: "]"
          - paragraph [ref=e658]:
            - text: On the day the
            - link "February 1917 Revolution" [ref=e659] [cursor=pointer]:
              - /url: /wiki/February_Revolution
            - text: began in Saint Petersburg, Rachmaninoff performed a piano recital in Moscow in aid of wounded Russian soldiers who had fought in the war.
            - superscript [ref=e660]:
              - link "[127]" [ref=e661] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEScott2011[httpsarchiveorgdetailsrachmaninoff0000scotpage117mode2up_117]-130"
            - text: He returned to Ivanovka two months later, finding it in chaos after a group of
            - link "Social Revolutionary Party" [ref=e662] [cursor=pointer]:
              - /url: /wiki/Social_Revolutionary_Party
            - text: members seized it as their own communal property.
            - superscript [ref=e663]:
              - link "[128]" [ref=e664] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESylvester2014[httpsbooksgooglecombooksidt3rDAgAAQBAJpgPA257_257]-131"
            - text: Despite having invested most of his earnings on the estate, Rachmaninoff left the property after three weeks, vowing never to return.
            - superscript [ref=e665]:
              - link "[129]" [ref=e666] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage51mode2up_51]-132"
            - text: It was soon confiscated by the communist authorities and became derelict.
            - superscript [ref=e667]:
              - link "[130]" [ref=e668] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEScott2011[httpsarchiveorgdetailsrachmaninoff0000scotpage118mode2up_118]-133"
            - text: In June 1917, Rachmaninoff asked Siloti to produce visas for him and his family so they could leave Russia, but Siloti was unable to help. After a break with his family in the more peaceful
            - link "Crimea" [ref=e669] [cursor=pointer]:
              - /url: /wiki/Crimea
            - text: ", Rachmaninoff's concert performance in"
            - link "Yalta" [ref=e670] [cursor=pointer]:
              - /url: /wiki/Yalta
            - text: on 5 September 1917 was to be his last in Russia. Upon returning to Moscow, the political tension surrounding the
            - link "October Revolution" [ref=e671] [cursor=pointer]:
              - /url: /wiki/October_Revolution
            - text: found the composer keeping his family safe indoors and being involved in a collective at his apartment building where he attended committee meetings and kept guard at night. He completed revisions to his Piano Concerto No. 1 among gunshots and rallies outside.
            - superscript [ref=e672]:
              - link "[131]" [ref=e673] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage52mode2up_52]-134"
            - superscript [ref=e674]:
              - link "[132]" [ref=e675] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTELyle1939[httpsarchiveorgdetailsrachmaninoffbiog00lylepage162mode2up_162]-135"
          - figure "Rachmaninoff and Struve, 1918" [ref=e676]:
            - link [ref=e677] [cursor=pointer]:
              - /url: /wiki/File:Rachmaninoff_and_Struve.JPG
              - img [ref=e678]
            - generic [ref=e679]: Rachmaninoff and Struve, 1918
          - paragraph [ref=e680]:
            - text: Amidst such turmoil, Rachmaninoff received an unexpected offer to perform ten piano recitals across
            - link "Scandinavia" [ref=e681] [cursor=pointer]:
              - /url: /wiki/Scandinavia
            - text: ", which he immediately accepted, using it as an excuse to obtain permits so he and his family could leave the country."
            - superscript [ref=e682]:
              - link "[133]" [ref=e683] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEScott2011[httpsarchiveorgdetailsrachmaninoff0000scotpage119mode2up_119]-136"
            - text: On 22 December 1917, they left Saint Petersburg by train to the Finnish border, from where they travelled through Finland on an open sled and train to
            - link "Helsinki" [ref=e684] [cursor=pointer]:
              - /url: /wiki/Helsinki
            - text: . Carrying what they could pack into their small suitcases, Rachmaninoff brought some sketches of compositions and scores to the first act of his unfinished opera
            - link "Monna Vanna" [ref=e686] [cursor=pointer]:
              - /url: /wiki/Monna_Vanna
            - text: and Rimsky-Korsakov's opera
            - link "The Golden Cockerel" [ref=e688] [cursor=pointer]:
              - /url: /wiki/The_Golden_Cockerel
            - text: . They arrived in
            - link "Stockholm" [ref=e689] [cursor=pointer]:
              - /url: /wiki/Stockholm
            - text: ", Sweden, on 24 December."
            - superscript [ref=e690]:
              - link "[134]" [ref=e691] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage210mode2up_210]-137"
            - text: In January 1918, they relocated to
            - link "Copenhagen" [ref=e692] [cursor=pointer]:
              - /url: /wiki/Copenhagen
            - text: ", Denmark, and, with the help of friend and composer"
            - link "Nikolai Struve" [ref=e693] [cursor=pointer]:
              - /url: /w/index.php?title=Nikolai_Struve&action=edit&redlink=1
            - generic [ref=e694]:
              - text: "["
              - link "ru" [ref=e695] [cursor=pointer]:
                - /url: https://ru.wikipedia.org/wiki/%D0%A1%D1%82%D1%80%D1%83%D0%B2%D0%B5,_%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9_%D0%93%D1%83%D1%81%D1%82%D0%B0%D0%B2%D0%BE%D0%B2%D0%B8%D1%87
              - text: "]"
            - text: (1875–1920), settled on the ground floor of a house.
            - superscript [ref=e696]:
              - link "[135]" [ref=e697] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage53mode2up_53]-138"
            - text: In debt and in need of money, the 44-year-old Rachmaninoff chose performing as his main source of income, as a career solely in composition was too restrictive.
            - superscript [ref=e698]:
              - link "[136]" [ref=e699] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEWehrmeyer200488-139"
            - text: His piano repertoire was small, which prompted the start of regular practice of his technique and learning new pieces to play. Rachmaninoff toured between February and October 1918.
            - superscript [ref=e700]:
              - link "[137]" [ref=e701] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEScott2011[httpsarchiveorgdetailsrachmaninoff0000scotpage120mode2up_120]-140"
            - superscript [ref=e702]:
              - link "[138]" [ref=e703] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage54mode2up_54]-141"
          - paragraph [ref=e704]:
            - text: "During the Scandinavian tour, Rachmaninoff received three offers from the US: to become the conductor of the"
            - link "Cincinnati Symphony Orchestra" [ref=e705] [cursor=pointer]:
              - /url: /wiki/Cincinnati_Symphony_Orchestra
            - text: for two years, to conduct 110 concerts in 30 weeks for the Boston Symphony Orchestra, and to give 25 piano recitals.
            - superscript [ref=e706]:
              - link "[138]" [ref=e707] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage54mode2up_54]-141"
            - text: He was worried about such a commitment in an unfamiliar country and had few good memories from his debut tour in 1909, so he declined all three. Not long after his decision, Rachmaninoff considered the United States financially advantageous as he could not support his family through composition alone. Unable to afford the travel fees, he was sent an advance loan for the journey by Russian banker and fellow emigre Alexander Kamenka.
            - superscript [ref=e708]:
              - link "[138]" [ref=e709] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage54mode2up_54]-141"
            - text: Money was also received from friends and admirers; pianist
            - link "Ignaz Friedman" [ref=e710] [cursor=pointer]:
              - /url: /wiki/Ignaz_Friedman
            - text: contributed $2,000.
            - superscript [ref=e711]:
              - link "[136]" [ref=e712] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEWehrmeyer200488-139"
            - text: On 1 November 1918, the Rachmaninoffs boarded the
            - link "SS Bergensfjord" [ref=e713] [cursor=pointer]:
              - /url: /wiki/SS_Bergensfjord
            - text: in
            - link "Oslo" [ref=e714] [cursor=pointer]:
              - /url: /wiki/Oslo
            - text: ", Norway, bound for New York City, arriving eleven days later. News of the composer's arrival spread, causing a crowd of musicians, artists, and fans to gather outside"
            - link "The Sherry-Netherland" [ref=e715] [cursor=pointer]:
              - /url: /wiki/The_Sherry-Netherland
            - text: hotel, where he was staying.
            - superscript [ref=e716]:
              - link "[138]" [ref=e717] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage54mode2up_54]-141"
          - paragraph [ref=e718]:
            - text: Rachmaninoff quickly dealt with business, hiring pianist
            - link "Dagmar de Corval Rybner" [ref=e719] [cursor=pointer]:
              - /url: /wiki/Dagmar_de_Corval_Rybner
            - text: as his secretary, interpreter, and aide in dealing with American life.
            - superscript [ref=e720]:
              - link "[139]" [ref=e721] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage55mode2up_55]-142"
            - text: He reunited with
            - link "Josef Hofmann" [ref=e722] [cursor=pointer]:
              - /url: /wiki/Josef_Hofmann
            - text: ", who informed several concert managers that the composer was available and suggested he choose Charles Ellis as his booking agent. Ellis organised 36 performances for Rachmaninoff for the upcoming 1918–1919 concert season; the first, a piano recital, took place on 8 December at"
            - link "Providence, Rhode Island" [ref=e723] [cursor=pointer]:
              - /url: /wiki/Providence,_Rhode_Island
            - text: . Rachmaninoff, still in recovery from a case of the
            - link "Spanish flu" [ref=e724] [cursor=pointer]:
              - /url: /wiki/1918_flu_pandemic
            - text: ", included his arrangement of \""
            - link "The Star-Spangled Banner" [ref=e725] [cursor=pointer]:
              - /url: /wiki/The_Star-Spangled_Banner
            - text: "\" in the program."
            - superscript [ref=e726]:
              - link "[140]" [ref=e727] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage113mode2up_220]-143"
            - superscript [ref=e728]:
              - link "[141]" [ref=e729] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990292–293-144"
            - text: Before the tour he had received offers from numerous piano manufacturers to tour with their instruments; he chose
            - link "Steinway" [ref=e730] [cursor=pointer]:
              - /url: /wiki/Steinway_and_Sons
            - text: ", the only one that did not offer him money. Steinway's association with Rachmaninoff continued for the rest of his life."
            - superscript [ref=e731]:
              - link "[142]" [ref=e732] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage56mode2up_56]-145"
            - superscript [ref=e733]:
              - link "[143]" [ref=e734] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEScott2011[httpsarchiveorgdetailsrachmaninoff0000scotpage122mode2up_122]-146"
          - figure "Rachmaninoff in front of a giant Redwood tree in California, 1919" [ref=e735]:
            - link [ref=e736] [cursor=pointer]:
              - /url: /wiki/File:Sergei_Rachmaninoff,_California.jpg
              - img [ref=e737]
            - generic [ref=e738]:
              - text: Rachmaninoff in front of a giant
              - link "Redwood tree" [ref=e739] [cursor=pointer]:
                - /url: /wiki/Sequoioideae
              - text: in California, 1919
          - paragraph [ref=e740]:
            - text: After the first tour ended in April 1919, Rachmaninoff took his family on a break to
            - link "San Francisco" [ref=e741] [cursor=pointer]:
              - /url: /wiki/San_Francisco
            - text: . He recuperated and prepared for the upcoming season, a cycle that he would adopt for most of his remaining life. As a touring performer Rachmaninoff became financially secure without much difficulty, and the family lived an upper middle class life with servants, a chef, and chauffeur.
            - superscript [ref=e742]:
              - link "[144]" [ref=e743] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEWehrmeyer200489–90-147"
            - text: They recreated the atmosphere of Ivanovka in their New York City apartment by entertaining Russian guests, employing Russians, and continuing to observe Russian customs.
            - superscript [ref=e744]:
              - link "[145]" [ref=e745] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001b[httpsarchiveorgdetailsnewgrovedictiona0020unsepage711mode2up_711]-148"
            - text: Despite the ability to speak some English, Rachmaninoff had his correspondence translated into Russian.
            - superscript [ref=e746]:
              - link "[146]" [ref=e747] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEWehrmeyer200489-149"
            - text: He enjoyed some personal luxuries, including quality tailored suits and the latest models of cars.
            - superscript [ref=e748]:
              - link "[144]" [ref=e749] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEWehrmeyer200489–90-147"
          - paragraph [ref=e750]:
            - text: In 1920, Rachmaninoff signed a recording contract with the
            - link "Victor Talking Machine Company" [ref=e751] [cursor=pointer]:
              - /url: /wiki/Victor_Talking_Machine_Company
            - text: which earned him some much needed income and began his longtime association with
            - link "RCA" [ref=e752] [cursor=pointer]:
              - /url: /wiki/RCA_Corporation
            - text: .
            - superscript [ref=e753]:
              - link "[142]" [ref=e754] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage56mode2up_56]-145"
            - text: During a family holiday in
            - link "Goshen, New York" [ref=e755] [cursor=pointer]:
              - /url: /wiki/Goshen,_New_York
            - text: ", that summer he learned of Struve's accidental death, prompting Rachmaninoff to strengthen the ties he had with those still in Russia by arranging with his bank to send regular money and food parcels to his family, friends, students, and those in need."
            - superscript [ref=e756]:
              - link "[147]" [ref=e757] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage233mode2up_233–234]-150"
            - superscript [ref=e758]:
              - link "[148]" [ref=e759] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage57mode2up_57]-151"
            - text: Early 1921 saw Rachmaninoff apply for documentation to visit Russia, the only time he would do so after leaving the country, but progress ceased when he underwent surgery for pain in his right temple. The operation failed to relieve his symptoms and relief only came after having dental work years later.
            - superscript [ref=e760]:
              - link "[147]" [ref=e761] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage233mode2up_233–234]-150"
            - text: After leaving the hospital, he purchased an apartment on 33 Riverside Drive on the
            - link "Upper West Side" [ref=e762] [cursor=pointer]:
              - /url: /wiki/Upper_West_Side
            - text: of Manhattan, overlooking the
            - link "Hudson River" [ref=e763] [cursor=pointer]:
              - /url: /wiki/Hudson_River
            - text: .
            - superscript [ref=e764]:
              - link "[147]" [ref=e765] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage233mode2up_233–234]-150"
          - paragraph [ref=e766]:
            - text: Rachmaninoff's first visit to Europe since emigrating occurred in May 1922, with concerts in London.
            - superscript [ref=e767]:
              - link "[149]" [ref=e768] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEWehrmeyer2004126-152"
            - text: This was followed by the Rachmaninoffs and the Satins reuniting in Dresden, after which the composer prepared for a hectic 1922–1923 concert season of 71 performances in five months.
            - superscript [ref=e769]:
              - link "[150]" [ref=e770] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEScott2011[httpsarchiveorgdetailsrachmaninoff0000scotpage130mode2up_130]-153"
            - text: For a while, he rented a railway carriage that was fitted with a piano and belongings to save time with suitcases.
            - superscript [ref=e771]:
              - link "[151]" [ref=e772] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage58mode2up_58]-154"
            - text: In 1924, Rachmaninoff declined an invitation to become conductor of the Boston Symphony Orchestra.
            - superscript [ref=e773]:
              - link "[136]" [ref=e774] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEWehrmeyer200488-139"
            - text: In 1925, Rachmaninoff's first daughter, Irina, became widowed while pregnant with his granddaughter, Sophie Volkonsky. Subsequently, Rachmaninoff founded TAIR — a publishing company named after his daughters, Tatiana and Irina. Based in Paris, TAIR specialised in works by Rachmaninoff and by other Russian composers.
            - superscript [ref=e775]:
              - link "[152]" [ref=e776] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTECunningham2001[httpsbooksgooglecombooksidk2YrwE8GaLECpgPA5_5–6]-155"
          - generic [ref=e777]:
            - 'heading "1926–1942: Touring, final compositions, and Villa Senar" [level=3] [ref=e778]': "1926–1942: Touring, final compositions, and Villa Senar"
            - generic [ref=e779]:
              - text: "["
              - link "edit" [ref=e780] [cursor=pointer]:
                - /url: /w/index.php?title=Sergei_Rachmaninoff&action=edit&section=8
              - text: "]"
          - paragraph [ref=e781]:
            - text: Rachmaninoff's life as a touring performer, and the demanding schedules that came with it, caused his compositional output to slow significantly. In the 24 years between his arrival in the US and his death, he completed just six new pieces, revised some of his earlier works, and wrote piano transcriptions for his live repertoire.
            - superscript [ref=e782]:
              - link "[153]" [ref=e783] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEWehrmeyer2004102-156"
            - text: "He admitted that by leaving Russia, \"I left behind my desire to compose: losing my country, I lost myself also\"."
            - superscript [ref=e784]:
              - link "[154]" [ref=e785] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990[httpsbooksgooglecombooksid_zkrDwAAQBAJpgPA26_26]-157"
            - text: In 1926, having concentrated on touring for the past eight years, he took a year off and completed the
            - link "Piano Concerto No. 4" [ref=e786] [cursor=pointer]:
              - /url: /wiki/Piano_Concerto_No._4_(Rachmaninoff)
            - text: ", which he had started in 1917, and"
            - link "Three Russian Songs" [ref=e788] [cursor=pointer]:
              - /url: /wiki/Three_Russian_Songs,_Op._41_(Rachmaninoff)
            - text: ", which he dedicated to"
            - link "Leopold Stokowski" [ref=e789] [cursor=pointer]:
              - /url: /wiki/Leopold_Stokowski
            - text: .
            - superscript [ref=e790]:
              - link "[155]" [ref=e791] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEWehrmeyer2004103,_126-158"
            - superscript [ref=e792]:
              - link "[156]" [ref=e793] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTECunningham2001[httpsbooksgooglecombooksidk2YrwE8GaLECpgPA6_6]-159"
          - paragraph [ref=e794]:
            - text: Rachmaninoff sought the company of fellow Russian musicians and befriended pianist
            - link "Vladimir Horowitz" [ref=e795] [cursor=pointer]:
              - /url: /wiki/Vladimir_Horowitz
            - text: in 1928.
            - superscript [ref=e796]:
              - link "[157]" [ref=e797] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEPlaskin1983[httpsarchiveorgdetailshorowitz00glenpage106mode_107]-160"
            - text: The men remained supportive of each other's work, each making a point of attending concerts given by the other,
            - superscript [ref=e798]:
              - link "[158]" [ref=e799] [cursor=pointer]:
                - /url: "#cite_note-161"
            - text: and Horowitz remained a champion of Rachmaninoff's works and in particular his Piano Concerto No. 3.
            - superscript [ref=e800]:
              - link "[159]" [ref=e801] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEPlaskin1983[httpsarchiveorgdetailshorowitz00glenpage185mode2up_185]-162"
            - text: In 1930, in a rare occurrence, Rachmaninoff allowed Italian composer
            - link "Ottorino Respighi" [ref=e802] [cursor=pointer]:
              - /url: /wiki/Ottorino_Respighi
            - text: to orchestrate pieces from his
            - link "Études-Tableaux, Op. 33" [ref=e803] [cursor=pointer]:
              - /url: /wiki/%C3%89tudes-Tableaux,_Op._33
            - text: (1911) and the
            - link "Études-Tableaux, Op. 39" [ref=e804] [cursor=pointer]:
              - /url: /wiki/%C3%89tudes-Tableaux,_Op._39
            - text: (1917), giving Respighi the inspirations behind the compositions.
            - superscript [ref=e805]:
              - link "[160]" [ref=e806] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage262mode2up_262]-163"
            - text: By December 1931, his daughter was engaged to marry Boris Conus, with a second grandchild Alexander Conus born later to the couple.
            - superscript [ref=e807]:
              - link "[161]" [ref=e808] [cursor=pointer]:
                - /url: "#cite_note-164"
            - text: In 1931, Rachmaninoff and several others signed an article in
            - link "The New York Times" [ref=e810] [cursor=pointer]:
              - /url: /wiki/The_New_York_Times
            - text: that criticised the cultural policies of the
            - link "Soviet Union" [ref=e811] [cursor=pointer]:
              - /url: /wiki/Soviet_Union
            - text: .
            - superscript [ref=e812]:
              - link "[162]" [ref=e813] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage271mode2up_271]-165"
            - text: The composer's music suffered a boycott in the Soviet Union as a result from the backlash in the Soviet press, lasting until 1933.
            - superscript [ref=e814]:
              - link "[149]" [ref=e815] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEWehrmeyer2004126-152"
          - figure "Villa Senar, now open to the public, where the Rhapsody on a Theme of Paganini and Symphony No. 3 were composed" [ref=e816]:
            - link [ref=e817] [cursor=pointer]:
              - /url: /wiki/File:Weggis-Hertenstein-Villa_Senar-04ASD.jpg
              - img [ref=e818]
            - generic [ref=e819]: Villa Senar, now open to the public, where the Rhapsody on a Theme of Paganini and Symphony No. 3 were composed
          - paragraph [ref=e820]:
            - text: From 1929 to 1931, Rachmaninoff spent his summers in France at
            - link "Clairefontaine-en-Yvelines" [ref=e821] [cursor=pointer]:
              - /url: /wiki/Clairefontaine-en-Yvelines
            - text: near
            - link "Rambouillet" [ref=e822] [cursor=pointer]:
              - /url: /wiki/Rambouillet
            - text: ", meeting with fellow Russian émigrés and his daughters. By 1930, his desire to compose had returned and he sought a new location to write new pieces. He bought a plot of land near"
            - link "Hertenstein" [ref=e823] [cursor=pointer]:
              - /url: /wiki/Hertenstein,_Lucerne
            - text: on the banks of
            - link "Lake Lucerne" [ref=e824] [cursor=pointer]:
              - /url: /wiki/Lake_Lucerne
            - text: ", Switzerland, and oversaw the construction of his home which he named"
            - link "Villa Senar" [ref=e825] [cursor=pointer]:
              - /url: /wiki/Villa_Senar
            - text: after the first two letters of his and his wife's name, adding the "r" from the family name.
            - superscript [ref=e826]:
              - link "[149]" [ref=e827] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEWehrmeyer2004126-152"
            - superscript [ref=e828]:
              - link "[163]" [ref=e829] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage208mode2up_208]-166"
            - text: Rachmaninoff spent his summers at Villa Senar until 1939, often with his daughters and grandchildren, with whom he would drive his motorboat on Lake Lucerne, one of his favourite activities.
            - superscript [ref=e830]:
              - link "[163]" [ref=e831] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage208mode2up_208]-166"
            - text: In the comfort of his own home, Rachmaninoff completed
            - link "Rhapsody on a Theme of Paganini" [ref=e833] [cursor=pointer]:
              - /url: /wiki/Rhapsody_on_a_Theme_of_Paganini
            - text: in 1934 and the
            - link "Symphony No. 3" [ref=e834] [cursor=pointer]:
              - /url: /wiki/Symphony_No._3_(Rachmaninoff)
            - text: in 1936.
          - paragraph [ref=e835]:
            - text: In October 1932, Rachmaninoff began a demanding concert season that consisted of 50 performances. The tour marked the fortieth anniversary of his debut as a pianist, for which several of his Russian friends now living in America sent him a scroll and wreath in celebration.
            - superscript [ref=e836]:
              - link "[164]" [ref=e837] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage67mode2up_67]-167"
            - text: The frail economic situation in the US resulted in the composer performing to smaller audiences, and he lost money in his investments and shares. The European leg of this tour in 1933 saw Rachmaninoff celebrate his sixtieth birthday among fellow musicians and friends, after which he retreated to Villa Senar for the summer.
            - superscript [ref=e838]:
              - link "[164]" [ref=e839] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage67mode2up_67]-167"
            - text: In May 1934, Rachmaninoff underwent a minor operation and two years later, he retreated to
            - link "Aix-les-Bains" [ref=e840] [cursor=pointer]:
              - /url: /wiki/Aix-les-Bains
            - text: in France to improve his arthritis.
            - superscript [ref=e841]:
              - link "[165]" [ref=e842] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage69mode2up_69]-168"
            - text: During a visit to Villa Senar in 1937, Rachmaninoff entered talks with choreographer
            - link "Michel Fokine" [ref=e843] [cursor=pointer]:
              - /url: /wiki/Michel_Fokine
            - text: about a ballet based on
            - link "Niccolò Paganini" [ref=e844] [cursor=pointer]:
              - /url: /wiki/Niccol%C3%B2_Paganini
            - text: that was to feature his rhapsody. It premiered in London in 1939 with the composer's daughters in attendance.
            - superscript [ref=e845]:
              - link "[166]" [ref=e846] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage70mode2up_70]-169"
            - text: In 1938, Rachmaninoff performed his Piano Concerto No. 2 at a charity jubilee concert at London's
            - link "Royal Albert Hall" [ref=e847] [cursor=pointer]:
              - /url: /wiki/Royal_Albert_Hall
            - text: to celebrate
            - link "Henry Wood" [ref=e848] [cursor=pointer]:
              - /url: /wiki/Henry_Wood
            - text: ", founder of the"
            - link "Promenade concerts" [ref=e849] [cursor=pointer]:
              - /url: /wiki/BBC_Proms
            - text: and an admirer of Rachmaninoff's who wanted him to be the show's only soloist. Rachmaninoff agreed, so long as the performance was not broadcast on the radio due to his aversion to the medium.
            - superscript [ref=e850]:
              - link "[167]" [ref=e851] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage71mode2up_71]-170"
          - paragraph [ref=e852]:
            - text: The 1939–40 concert season saw Rachmaninoff perform fewer concerts than usual, totalling 43 appearances that were mostly in the US. The tour continued with dates across England, after which Rachmaninoff visited his daughter Tatyana in Paris followed by a return to Villa Senar. He was unable to perform for a while after slipping on the floor at the villa and injuring himself.
            - superscript [ref=e853]:
              - link "[168]" [ref=e854] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage348mode2up_348–349]-171"
            - text: He recovered enough to perform at the Lucerne International Music Festival on 11 August 1939. It was to be his final concert in Europe. With
            - link "World War II" [ref=e855] [cursor=pointer]:
              - /url: /wiki/World_War_II
            - text: imminent, he returned to Paris two days later, where he, his wife, and two daughters were together for the last time before the composer left Europe on 23 August.
            - superscript [ref=e856]:
              - link "[169]" [ref=e857] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage72mode2up_72]-172"
            - superscript [ref=e858]:
              - link "[170]" [ref=e859] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage322mode2up_322]-173"
            - text: With financial help from Rachmaninoff, philosopher
            - link "Ivan Ilyin" [ref=e860] [cursor=pointer]:
              - /url: /wiki/Ivan_Ilyin
            - text: was able to pay the
            - link "bail" [ref=e861] [cursor=pointer]:
              - /url: /wiki/Bail
            - text: and settle in Switzerland. Rachmaninoff would support the
            - link "Soviet Union" [ref=e862] [cursor=pointer]:
              - /url: /wiki/Soviet_Union
            - text: "'s war effort against"
            - link "Nazi Germany" [ref=e863] [cursor=pointer]:
              - /url: /wiki/Nazi_Germany
            - text: from mid-1941 onwards, donating receipts from many of his concerts for the benefit of the
            - link "Red Army" [ref=e864] [cursor=pointer]:
              - /url: /wiki/Red_Army
            - text: .
            - superscript [ref=e865]:
              - link "[171]" [ref=e866] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage225mode2up_225]-174"
          - paragraph [ref=e867]:
            - text: Upon his return to the US, Rachmaninoff performed with the
            - link "Philadelphia Orchestra" [ref=e868] [cursor=pointer]:
              - /url: /wiki/Philadelphia_Orchestra
            - text: in New York City with conductor
            - link "Eugene Ormandy" [ref=e869] [cursor=pointer]:
              - /url: /wiki/Eugene_Ormandy
            - text: on 26 November and 3 December 1939, as part of the orchestra's special series of concerts dedicated to the composer in celebration of the thirtieth anniversary of his US debut.
            - superscript [ref=e870]:
              - link "[172]" [ref=e871] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage73mode2up_73]-175"
            - text: The final concert on 10 December saw Rachmaninoff conduct his Symphony No. 3 and The Bells, marking his first conducting performance since 1917.
            - superscript [ref=e872]:
              - link "[173]" [ref=e873] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage323mode2up_323]-176"
            - text: The concert season left Rachmaninoff tired, and he spent the summer resting from minor surgery at Orchard's Point, an estate near
            - link "Huntington, New York" [ref=e874] [cursor=pointer]:
              - /url: /wiki/Huntington,_New_York
            - text: "on"
            - link "Long Island" [ref=e875] [cursor=pointer]:
              - /url: /wiki/Long_Island
            - text: .
            - superscript [ref=e876]:
              - link "[174]" [ref=e877] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage323mode2up_323],_[httpsarchiveorgdetailsrachmaninofflife0000harrpage330mode2up_330]-177"
            - text: During this period Rachmaninoff completed his final composition, the
            - link "Symphonic Dances" [ref=e878] [cursor=pointer]:
              - /url: /wiki/Symphonic_Dances_(Rachmaninoff)
            - text: ", Op. 45, which was premiered by Ormandy and the Philadelphia Orchestra in January 1941, with Rachmaninoff in attendance."
            - superscript [ref=e879]:
              - link "[172]" [ref=e880] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage73mode2up_73]-175"
            - text: In December 1939, Rachmaninoff began an extensive recording period which lasted until February 1942 and included his Piano Concerto Nos. 1 and 3 and Symphony No. 3 at the
            - link "Philadelphia Academy of Music" [ref=e881] [cursor=pointer]:
              - /url: /wiki/Academy_of_Music_(Philadelphia)
            - text: .
            - superscript [ref=e882]:
              - link "[173]" [ref=e883] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage323mode2up_323]-176"
          - generic [ref=e884]:
            - 'heading "1942–1943: Illness, move to California, and death" [level=3] [ref=e885]': "1942–1943: Illness, move to California, and death"
            - generic [ref=e886]:
              - text: "["
              - link "edit" [ref=e887] [cursor=pointer]:
                - /url: /w/index.php?title=Sergei_Rachmaninoff&action=edit&section=9
              - text: "]"
          - figure "Sergei Rachmaninoff house at 610 North Elm Drive in Beverly Hills, California" [ref=e888]:
            - link [ref=e889] [cursor=pointer]:
              - /url: /wiki/File:Sergei_Rachmaninoff_house._610_Elm_Drive_Beverly_Hills,_California_20220617_154140_3_(1).jpg
              - img [ref=e890]
            - generic [ref=e891]: Sergei Rachmaninoff house at 610 North Elm Drive in Beverly Hills, California
          - paragraph [ref=e892]:
            - text: In early 1942, Rachmaninoff was advised by his doctor to relocate to a warmer climate to improve his health after suffering from
            - link "sclerosis" [ref=e893] [cursor=pointer]:
              - /url: /wiki/Sclerosis_(medicine)
            - text: ","
            - link "lumbago" [ref=e894] [cursor=pointer]:
              - /url: /wiki/Lumbago
            - text: ","
            - link "neuralgia" [ref=e895] [cursor=pointer]:
              - /url: /wiki/Neuralgia
            - text: ", high blood pressure, and headaches."
            - superscript [ref=e896]:
              - link "[175]" [ref=e897] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTERobinson2007[httpsbooksgooglecombooksidi2hxJrlSE0ACpgPA129_129]-178"
            - text: After he completed his final studio recording sessions during this time in February,
            - superscript [ref=e898]:
              - link "[176]" [ref=e899] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage340mode2up_340]-179"
            - text: a move to Long Island fell through after the composer and his wife expressed a greater interest in California, and initially settled in a leased home on Tower Road in
            - link "Beverly Hills" [ref=e900] [cursor=pointer]:
              - /url: /wiki/Beverly_Hills,_California
            - text: in May.
            - superscript [ref=e901]:
              - link "[175]" [ref=e902] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTERobinson2007[httpsbooksgooglecombooksidi2hxJrlSE0ACpgPA129_129]-178"
            - superscript [ref=e903]:
              - link "[172]" [ref=e904] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage73mode2up_73]-175"
            - text: In June they purchased a home at 610 North Elm Drive in Beverly Hills, living close to Horowitz who would often visit and perform piano duets with Rachmaninoff.
            - superscript [ref=e905]:
              - link "[177]" [ref=e906] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage343mode2up_343]-180"
            - superscript [ref=e907]:
              - link "[169]" [ref=e908] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage72mode2up_72]-172"
            - text: Later in 1942, Rachmaninoff invited
            - link "Igor Stravinsky" [ref=e909] [cursor=pointer]:
              - /url: /wiki/Igor_Stravinsky
            - text: to dinner, the two sharing their worries of a war-torn Russia and their children in France.
            - superscript [ref=e910]:
              - link "[178]" [ref=e911] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEWehrmeyer2004111–112-181"
            - superscript [ref=e912]:
              - link "[179]" [ref=e913] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEScott2011[httpsarchiveorgdetailsrachmaninoff0000scotpage197mode2up_197]-182"
          - figure "Statue commemorating Rachmaninoff's last concert, in Knoxville, Tennessee" [ref=e914]:
            - link [ref=e915] [cursor=pointer]:
              - /url: /wiki/File:SR_statue_Knoxville_front.jpg
              - img [ref=e916]
            - generic [ref=e917]:
              - text: Statue commemorating Rachmaninoff's last concert, in
              - link "Knoxville, Tennessee" [ref=e918] [cursor=pointer]:
                - /url: /wiki/Knoxville,_Tennessee
          - paragraph [ref=e919]:
            - text: Shortly after a performance at the
            - link "Hollywood Bowl" [ref=e920] [cursor=pointer]:
              - /url: /wiki/Hollywood_Bowl
            - text: in July 1942, Rachmaninoff was suffering from lumbago and fatigue. He informed his doctor, Alexander Golitsyn, that the upcoming 1942–43 concert season would be his last, in order to dedicate his time to composition.
            - superscript [ref=e921]:
              - link "[180]" [ref=e922] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage344mode2up_344]-183"
            - superscript [ref=e923]:
              - link "[172]" [ref=e924] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage73mode2up_73]-175"
            - text: The tour began on 12 October 1942 and the composer received many positive reviews from critics despite his deteriorating health.
            - superscript [ref=e925]:
              - link "[172]" [ref=e926] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage73mode2up_73]-175"
            - text: Rachmaninoff and his wife Natalia were among the 220 people who became
            - link "naturalised" [ref=e927] [cursor=pointer]:
              - /url: /wiki/Naturalization
            - text: American citizens at a ceremony held in New York City on 1 February 1943.
            - superscript [ref=e928]:
              - link "[156]" [ref=e929] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTECunningham2001[httpsbooksgooglecombooksidk2YrwE8GaLECpgPA6_6]-159"
            - superscript [ref=e930]:
              - link "[181]" [ref=e931] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTECannata199924-184"
            - text: Later that month he complained of persistent cough and back pain; a doctor diagnosed him with pleurisy and advised that a warmer climate would aid in his recovery. Rachmaninoff opted to continue with touring, but felt so ill during his travels to
            - link "Florida" [ref=e932] [cursor=pointer]:
              - /url: /wiki/Florida
            - text: that the remaining dates were cancelled and he returned to California by train, where an ambulance took him to hospital. It was then that Rachmaninoff was diagnosed with an aggressive form of
            - link "melanoma" [ref=e933] [cursor=pointer]:
              - /url: /wiki/Melanoma
            - text: . His wife took Rachmaninoff home where he reunited with his daughter Irina.
            - superscript [ref=e934]:
              - link "[182]" [ref=e935] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage230mode2up_230–231]-185"
            - text: His last appearances as a concerto soloist, playing Beethoven's First Piano Concerto and his Rhapsody on a Theme of Paganini, were on 11 and 12 February with the
            - link "Chicago Symphony Orchestra" [ref=e936] [cursor=pointer]:
              - /url: /wiki/Chicago_Symphony_Orchestra
            - text: under the baton of
            - link "Hans Lange" [ref=e937] [cursor=pointer]:
              - /url: /wiki/Hans_Lange_(conductor)
            - text: ","
            - superscript [ref=e938]:
              - link "[183]" [ref=e939] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEScott2011[httpsarchiveorgdetailsrachmaninoff0000scotpage199mode2up_199]-186"
            - text: and on 17 February, at the
            - link "University of Tennessee" [ref=e940] [cursor=pointer]:
              - /url: /wiki/University_of_Tennessee
            - text: in
            - link "Knoxville, Tennessee" [ref=e941] [cursor=pointer]:
              - /url: /wiki/Knoxville,_Tennessee
            - text: ", he gave his last recital as a pianist."
            - superscript [ref=e942]:
              - link "[184]" [ref=e943] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage75mode2up_75]-187"
            - superscript [ref=e944]:
              - link "[185]" [ref=e945] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001b[httpsarchiveorgdetailsnewgrovedictiona0020unsepage713mode2up_713]-188"
            - superscript [ref=e946]:
              - link "[186]" [ref=e947] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990354-189"
          - figure "Rachmaninoff's grave at Kensico Cemetery in May 2006" [ref=e948]:
            - link [ref=e949] [cursor=pointer]:
              - /url: /wiki/File:Grave_of_Sergei_Rachmaninoff.jpg
              - img [ref=e950]
            - generic [ref=e951]:
              - text: Rachmaninoff's grave at
              - link "Kensico Cemetery" [ref=e952] [cursor=pointer]:
                - /url: /wiki/Kensico_Cemetery
              - text: in May 2006
          - paragraph [ref=e953]:
            - text: Rachmaninoff's health rapidly declined in the last week of March 1943. He lost his appetite, had constant pain in his arms and sides, and found it increasingly difficult to breathe. The composer lost consciousness and he died two days later, on 28 March 1943, at his home in Beverly Hills, at age 69.
            - superscript [ref=e954]:
              - link "[187]" [ref=e955] [cursor=pointer]:
                - /url: "#cite_note-190"
            - superscript [ref=e956]:
              - link "[188]" [ref=e957] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage230mode2up_230–232]-191"
            - text: A message with greetings from several Moscow composers arrived too late for Rachmaninoff to read.
            - superscript [ref=e958]:
              - link "[188]" [ref=e959] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESeroff1950[httpsarchiveorgdetailsrachmaninoff00seropage230mode2up_230–232]-191"
            - text: His funeral took place at the Holy Virgin Mary Russian Orthodox Church on Micheltorena Street in
            - link "Silver Lake" [ref=e960] [cursor=pointer]:
              - /url: /wiki/Silver_Lake,_Los_Angeles
            - text: .
            - superscript [ref=e961]:
              - link "[189]" [ref=e962] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTERobinson2007[httpsbooksgooglecombooksidi2hxJrlSE0ACpgPA130_130]-192"
            - text: In his will, Rachmaninoff wished to be buried at
            - link "Novodevichy Cemetery" [ref=e963] [cursor=pointer]:
              - /url: /wiki/Novodevichy_Cemetery
            - text: in Moscow, where Scriabin, Taneyev, and
            - link "Chekhov" [ref=e964] [cursor=pointer]:
              - /url: /wiki/Anton_Chekhov
            - text: were buried, but his American citizenship made that impossible.
            - superscript [ref=e965]:
              - link "[190]" [ref=e966] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEWehrmeyer2004113-193"
            - text: Instead, he was interred at
            - link "Kensico Cemetery" [ref=e967] [cursor=pointer]:
              - /url: /wiki/Kensico_Cemetery
            - text: in
            - link "Valhalla, New York" [ref=e968] [cursor=pointer]:
              - /url: /wiki/Valhalla,_New_York
            - text: .
            - superscript [ref=e969]:
              - link "[191]" [ref=e970] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage76mode2up_76]-194"
          - paragraph [ref=e971]:
            - text: After Rachmaninoff's death, poet
            - link "Marietta Shaginyan" [ref=e972] [cursor=pointer]:
              - /url: /wiki/Marietta_Shaginyan
            - text: published fifteen letters they exchanged from their first contact in February 1912 and their final meeting in July 1917.
            - superscript [ref=e973]:
              - link "[192]" [ref=e974] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage176mode2up_176]-195"
            - text: The nature of their relationship bordered on romantic, but was primarily intellectual and emotional. Shaginyan and the poetry she shared with Rachmaninoff have been cited as the inspiration for his Six Songs, Op. 38.
            - superscript [ref=e975]:
              - link "[193]" [ref=e976] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESimpson1984-196"
          - generic [ref=e977]:
            - heading "Music" [level=2] [ref=e978]
            - generic [ref=e979]:
              - text: "["
              - link "edit" [ref=e980] [cursor=pointer]:
                - /url: /w/index.php?title=Sergei_Rachmaninoff&action=edit&section=10
              - text: "]"
          - generic [ref=e981]:
            - heading "Influences" [level=3] [ref=e982]
            - generic [ref=e983]:
              - text: "["
              - link "edit" [ref=e984] [cursor=pointer]:
                - /url: /w/index.php?title=Sergei_Rachmaninoff&action=edit&section=11
              - text: "]"
          - paragraph [ref=e985]:
            - text: A major influence on Rachmaninoff as a composer was
            - link "Tchaikovsky" [ref=e986] [cursor=pointer]:
              - /url: /wiki/Tchaikovsky
            - text: . This influence can be seen throughout Rachmaninoff's early compositions, such as in his
            - link "Youth Symphony" [ref=e987] [cursor=pointer]:
              - /url: /wiki/Youth_Symphony_(Rachmaninoff)
            - text: ", which is reminiscent of Tchaikovsky's late symphonies, sections of his symphonic poem"
            - link "Prince Rostislav" [ref=e989] [cursor=pointer]:
              - /url: /wiki/Prince_Rostislav_(Rachmaninoff)
            - text: ", which emulates"
            - link "The Tempest" [ref=e991] [cursor=pointer]:
              - /url: /wiki/The_Tempest_(Tchaikovsky)
            - text: and
            - link "Romeo and Juliet" [ref=e993] [cursor=pointer]:
              - /url: /wiki/Romeo_and_Juliet_(Tchaikovsky)
            - text: ", and his youthful"
            - link "Three Nocturnes" [ref=e994] [cursor=pointer]:
              - /url: /wiki/Miscellaneous_solo_piano_compositions_(Rachmaninoff)
            - text: ", the third of which contains a chordal section very similar to the opening of Tchaikovsky's"
            - link "First Piano Concerto" [ref=e995] [cursor=pointer]:
              - /url: /wiki/Piano_Concerto_No._1_(Tchaikovsky)
            - text: .
            - superscript [ref=e996]:
              - link "[194]" [ref=e997] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris1983603-197"
            - text: His first opera, Aleko shows the influence of Tchaikovsky in both its harmonies, and in its allusions and references to
            - link "Eugene Onegin" [ref=e999] [cursor=pointer]:
              - /url: /wiki/Eugene_Onegin
            - text: .
            - superscript [ref=e1000]:
              - link "[195]" [ref=e1001] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEFrey2022104,_113–116-198"
            - text: Tchaikovsky was also particularly influential on Rachmaninoff's melodic writing, though musicologist
            - link "Stephen Walsh" [ref=e1002] [cursor=pointer]:
              - /url: /wiki/Stephen_Walsh_(writer)
            - text: describes Rachmaninoff's melodies as lacking the range or length of Tchaikovsky's.
            - superscript [ref=e1003]:
              - link "[196]" [ref=e1004] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEWalsh197315-199"
          - paragraph [ref=e1005]:
            - text: The influence of
            - link "Anton Arensky" [ref=e1006] [cursor=pointer]:
              - /url: /wiki/Anton_Arensky
            - text: ", who taught Rachmaninoff for five years while he was at the Moscow Conservatory, can be seen in the composer's early compositions."
            - superscript [ref=e1007]:
              - link "[197]" [ref=e1008] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn19909-200"
            - superscript [ref=e1009]:
              - link "[194]" [ref=e1010] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris1983603-197"
            - text: This influence can be seen, for example, in his symphonic poem Prince Rostislav, dedicated to Arensky, and a number of compositions from his student years may have been written as exercises for his teacher.
            - superscript [ref=e1011]:
              - link "[194]" [ref=e1012] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris1983603-197"
            - text: According to biographer Barrie Martyn, the "obviously Russian character" and "Tchaikovskian lyricism" of Arensky's music were elements which were also part of Rachmaninoff's compositional style.
            - superscript [ref=e1013]:
              - link "[198]" [ref=e1014] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn199010-201"
            - link "Sergei Taneyev" [ref=e1015] [cursor=pointer]:
              - /url: /wiki/Sergei_Taneyev
            - text: ", Rachmaninoff's teacher in counterpoint at the Moscow Conservatory, was also an influence on his early compositions,"
            - superscript [ref=e1016]:
              - link "[194]" [ref=e1017] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris1983603-197"
            - text: and Rachmaninoff would bring his compositions to Taneyev to gain his approval all the way up to 1915, the year in which Taneyev died.
            - superscript [ref=e1018]:
              - link "[199]" [ref=e1019] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn199011-202"
            - text: In his later style, the influence of
            - link "Rimsky-Korsakov" [ref=e1020] [cursor=pointer]:
              - /url: /wiki/Rimsky-Korsakov
            - text: can be seen in the increasingly chromatic harmonies and thinner orchestration in Rachmaninoff's compositions from his Third Piano Concerto onwards.
            - superscript [ref=e1021]:
              - link "[200]" [ref=e1022] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn199031-203"
          - generic [ref=e1023]:
            - heading "Works" [level=3] [ref=e1024]
            - generic [ref=e1025]:
              - text: "["
              - link "edit" [ref=e1026] [cursor=pointer]:
                - /url: /w/index.php?title=Sergei_Rachmaninoff&action=edit&section=12
              - text: "]"
          - note [ref=e1027]:
            - text: "Main article:"
            - link "List of compositions by Sergei Rachmaninoff" [ref=e1028] [cursor=pointer]:
              - /url: /wiki/List_of_compositions_by_Sergei_Rachmaninoff
          - generic [ref=e1030]:
            - 'img "\\relative c'''' { \\new PianoStaff << \\new Staff { \\key d \\minor << { <f a d f>4.^\\markup{\\bold{Allegro molto}}-> <e g a e''>8 <d f a d>4.-> <cis g'' a cis>8 <d g a d>4.-> <e g a e''>8 <d f a d>4.-> <e a d e>8 <f a d f>4.-> <e a d e>8 <f b d f>4.-> <d a'' b d>8 } \\\\ { r8 <d, g a d> <f a d f>4-- r8 <a, e'' g a> <d f a d>4-- r8 <d g a d> <e g a e''>4-- r8 <e a d e> <f a d f>4-- r8 <d g a d> <f a d f>4-- r8 <e b'' d e> <f b d f>4-- } >> } \\new Staff { \\key f \\major \\clef bass << { <f, a d f>4.-> <g a e''>8 <f a d>4.-> <e a cis>8 <f a d>4.-> <g a e''>8 <f a d>4.-> <g a d e>8 <f a d f>4.-> <f a d e>8 <f gis d'' f>4.-> <e a b d>8 } \\\\ { r8 <d,, d''> <a'''' d f a>4-- r8 <d, a''> <a'' d f a>4-- r8 <d, a''> <a'' e'' g a>4-- r8 <d, a''> <a'' d f a>4-- r8 <d, a''> <a'' d f a>4-- r8 <gis f''> <f'' b d>4-- } >> } >> }" [ref=e1034] [cursor=pointer]'
            - generic [ref=e1037]:
              - text: The cadenza of the
              - link "Piano Concerto No. 3" [ref=e1038] [cursor=pointer]:
                - /url: /wiki/Piano_Concerto_No._3_(Rachmaninoff)
              - text: is famous for its grand chords.
          - paragraph [ref=e1039]:
            - text: "Rachmaninoff wrote five works for piano and orchestra: four concertos—"
            - link "No. 1 in F-sharp minor" [ref=e1040] [cursor=pointer]:
              - /url: /wiki/Piano_Concerto_No._1_(Rachmaninoff)
            - text: ", Op. 1 (1891, revised 1917),"
            - link "No. 2 in C minor" [ref=e1041] [cursor=pointer]:
              - /url: /wiki/Piano_Concerto_No._2_(Rachmaninoff)
            - text: ", Op. 18 (1900–01),"
            - link "No. 3 in D minor" [ref=e1042] [cursor=pointer]:
              - /url: /wiki/Piano_Concerto_No._3_(Rachmaninoff)
            - text: ", Op. 30 (1909), and"
            - link "No. 4 in G minor" [ref=e1043] [cursor=pointer]:
              - /url: /wiki/Piano_Concerto_No._4_(Rachmaninoff)
            - text: ", Op. 40 (1926, revised 1928 and 1941)—and the"
            - link "Rhapsody on a Theme of Paganini" [ref=e1045] [cursor=pointer]:
              - /url: /wiki/Rhapsody_on_a_Theme_of_Paganini
            - text: (1934). Of the concertos, the Second and Third are the most popular.
            - superscript [ref=e1046]:
              - link "[201]" [ref=e1047] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEO'Connell1941380-204"
          - paragraph [ref=e1048]:
            - text: "Rachmaninoff also composed a number of works for orchestra alone. The three symphonies:"
            - link "No. 1 in D minor" [ref=e1049] [cursor=pointer]:
              - /url: /wiki/Symphony_No._1_(Rachmaninoff)
            - text: ", Op. 13 (1895),"
            - link "No. 2 in E minor" [ref=e1050] [cursor=pointer]:
              - /url: /wiki/Symphony_No._2_(Rachmaninoff)
            - text: ", Op. 27 (1907), and"
            - link "No. 3 in A minor" [ref=e1051] [cursor=pointer]:
              - /url: /wiki/Symphony_No._3_(Rachmaninoff)
            - text: ", Op. 44 (1935–36). Widely spaced chronologically, the symphonies represent three distinct phases in his compositional development. The Second has been the most popular of the three since its first performance. Among Rachmaninoff's other orchestral works are his"
            - link "Symphonic Dances" [ref=e1053] [cursor=pointer]:
              - /url: /wiki/Symphonic_Dances_(Rachmaninoff)
            - text: (Op. 45), his last major composition, and his four
            - link "symphonic poems" [ref=e1054] [cursor=pointer]:
              - /url: /wiki/Symphonic_poem
            - text: ":"
            - link "Prince Rostislav" [ref=e1056] [cursor=pointer]:
              - /url: /wiki/Prince_Rostislav_(Rachmaninoff)
            - text: ","
            - link "The Rock" [ref=e1058] [cursor=pointer]:
              - /url: /wiki/The_Rock_(Rachmaninoff)
            - text: (Op. 7),
            - link "Caprice bohémien" [ref=e1060] [cursor=pointer]:
              - /url: /wiki/Caprice_boh%C3%A9mien
            - text: (Op. 12), and
            - link "The Isle of the Dead" [ref=e1062] [cursor=pointer]:
              - /url: /wiki/Isle_of_the_Dead_(Rachmaninoff)
            - text: (Op. 29).
          - paragraph [ref=e1063]:
            - text: As Rachmaninoff was a skilled pianist, a large portion of his compositional output consists of works for solo piano. They include
            - link "24 Preludes traversing all 24 major and minor keys" [ref=e1064] [cursor=pointer]:
              - /url: /wiki/Preludes_(Rachmaninoff)
            - text: ;
            - link "Prelude in C-sharp minor" [ref=e1065] [cursor=pointer]:
              - /url: /wiki/Prelude_in_C-sharp_minor_(Rachmaninoff)
            - text: (Op. 3, No. 2) from
            - link "Morceaux de fantaisie" [ref=e1067] [cursor=pointer]:
              - /url: /wiki/Morceaux_de_fantaisie
            - text: (Op. 3);
            - link "ten preludes in Op. 23" [ref=e1068] [cursor=pointer]:
              - /url: /wiki/Preludes,_Op._23_(Rachmaninoff)
            - text: ; and
            - link "thirteen in Op. 32" [ref=e1069] [cursor=pointer]:
              - /url: /wiki/Preludes,_Op._32_(Rachmaninoff)
            - text: . Especially difficult are the two sets of Études-Tableaux,
            - link "Op. 33" [ref=e1070] [cursor=pointer]:
              - /url: /wiki/%C3%89tudes-Tableaux,_Op._33
            - text: and
            - link "39" [ref=e1071] [cursor=pointer]:
              - /url: /wiki/%C3%89tudes-Tableaux,_Op._39
            - text: ", which are very demanding study pictures. Stylistically, Op. 33 hearkens back to the preludes, while Op. 39 shows the influences of"
            - link "Scriabin" [ref=e1072] [cursor=pointer]:
              - /url: /wiki/Alexander_Scriabin
            - text: and
            - link "Prokofiev" [ref=e1073] [cursor=pointer]:
              - /url: /wiki/Sergei_Prokofiev
            - text: . There are also the
            - link "Six moments musicaux" [ref=e1075] [cursor=pointer]:
              - /url: /wiki/Six_moments_musicaux_(Rachmaninoff)
            - text: (Op. 16), the
            - link "Variations on a Theme of Chopin" [ref=e1077] [cursor=pointer]:
              - /url: /wiki/Variations_on_a_Theme_of_Chopin_(Rachmaninoff)
            - text: (Op. 22), and the
            - link "Variations on a Theme of Corelli" [ref=e1079] [cursor=pointer]:
              - /url: /wiki/Variations_on_a_Theme_of_Corelli
            - text: (Op. 42). He wrote two
            - link "piano sonatas" [ref=e1080] [cursor=pointer]:
              - /url: /wiki/Piano_sonata
            - text: ", both of which are large scale and virtuosic in their technical demands. Rachmaninoff also composed works for two pianos, four hands, including two Suites (the first subtitled Fantasie-Tableaux), a version of the Symphonic Dances (Op. 45), and an arrangement of the C-sharp minor Prelude, as well as a Russian Rhapsody, and he arranged his First Symphony (below) for piano four hands. Both these works were published posthumously."
          - paragraph [ref=e1081]:
            - text: Rachmaninoff wrote two major
            - link "a cappella" [ref=e1082] [cursor=pointer]:
              - /url: /wiki/A_cappella
            - text: choral works—the
            - link "Liturgy of St. John Chrysostom" [ref=e1084] [cursor=pointer]:
              - /url: /wiki/Liturgy_of_St._John_Chrysostom_(Rachmaninoff)
            - superscript [ref=e1085]:
              - link "[202]" [ref=e1086] [cursor=pointer]:
                - /url: "#cite_note-moody-205"
            - text: and the
            - link "All-Night Vigil" [ref=e1088] [cursor=pointer]:
              - /url: /wiki/All-Night_Vigil_(Rachmaninoff)
            - text: (also known as the Vespers). It was the fifth movement of All-Night Vigil that Rachmaninoff requested to have sung at his funeral. Other choral works include a
            - link "choral symphony" [ref=e1089] [cursor=pointer]:
              - /url: /wiki/Choral_symphony
            - text: ","
            - link "The Bells" [ref=e1091] [cursor=pointer]:
              - /url: /wiki/The_Bells_(symphony)
            - text: ; the cantata
            - link "Spring" [ref=e1092] [cursor=pointer]:
              - /url: /wiki/Spring_(Rachmaninoff)
            - text: ; the
            - link "Three Russian Songs" [ref=e1094] [cursor=pointer]:
              - /url: /wiki/Three_Russian_Songs,_Op._41_(Rachmaninoff)
            - text: ; and an early Concerto for Choir (a cappella).
          - paragraph [ref=e1095]:
            - text: "He completed three one-act operas:"
            - link "Aleko" [ref=e1097] [cursor=pointer]:
              - /url: /wiki/Aleko_(Rachmaninoff)
            - text: (1892),
            - link "The Miserly Knight" [ref=e1099] [cursor=pointer]:
              - /url: /wiki/The_Miserly_Knight
            - text: (1903), and
            - link "Francesca da Rimini" [ref=e1101] [cursor=pointer]:
              - /url: /wiki/Francesca_da_Rimini_(Rachmaninoff)
            - text: (1904). He started three others, notably
            - link "Monna Vanna" [ref=e1103] [cursor=pointer]:
              - /url: /wiki/Monna_Vanna
            - text: ", based on the work by"
            - link "Maurice Maeterlinck" [ref=e1104] [cursor=pointer]:
              - /url: /wiki/Maurice_Maeterlinck
            - text: ; copyright in this had been extended to the composer
            - link "Février" [ref=e1105] [cursor=pointer]:
              - /url: /wiki/Henry_F%C3%A9vrier
            - text: ","
            - superscript [ref=e1106]:
              - link "[203]" [ref=e1107] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMaes2002[httpsarchiveorgdetailshistoryofrussian0000maespage195mode2up_195]-206"
            - text: and, though the restriction did not pertain to Russia, Rachmaninoff dropped the project after completing act 1 in piano vocal score in 1908.
            - superscript [ref=e1108]:
              - link "[d]" [ref=e1109] [cursor=pointer]:
                - /url: "#cite_note-207"
            - text: Aleko is regularly performed and has been recorded complete at least eight times, and filmed. The Miserly Knight adheres to Pushkin's "little tragedy". Francesca da Rimini was described by the composer as a "symphonic opera" because of its long interludes.
            - superscript [ref=e1110]:
              - link "[204]" [ref=e1111] [cursor=pointer]:
                - /url: "#cite_note-208"
          - paragraph [ref=e1112]:
            - text: Rachmaninoff, similarly to many Russian composers of his time, wrote relatively little chamber music.
            - superscript [ref=e1113]:
              - link "[205]" [ref=e1114] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage122mode2up_122]-209"
            - text: His output in the genre includes two piano trios, both of which are named Trio Elégiaque (the
            - link "second" [ref=e1115] [cursor=pointer]:
              - /url: /wiki/Trio_%C3%A9l%C3%A9giaque_No._2_(Rachmaninoff)
            - text: of which is a memorial tribute to Tchaikovsky), a
            - link "Cello Sonata" [ref=e1116] [cursor=pointer]:
              - /url: /wiki/Cello_Sonata_(Rachmaninoff)
            - text: ", and the"
            - link "Morceaux de salon" [ref=e1117] [cursor=pointer]:
              - /url: /wiki/Morceaux_de_salon,_Op._6_(Rachmaninoff)
            - text: for violin and piano.
          - paragraph [ref=e1118]:
            - text: Rachmaninoff composed a total of 83 songs (románsy in Russian) for voice and piano, all of which were written before he left Russia permanently in 1917.
            - superscript [ref=e1119]:
              - link "[206]" [ref=e1120] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage138mode2up_138]-210"
            - superscript [ref=e1121]:
              - link "[207]" [ref=e1122] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESylvester2014[httpsbooksgooglecombooksidt3rDAgAAQBAJpgPR12_xii],_[httpsbooksgooglecombooksidt3rDAgAAQBAJpgPR14_xiv]-211"
            - text: Most of his songs were set to texts by Russian romantic writers and poets,
            - superscript [ref=e1123]:
              - link "[206]" [ref=e1124] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage138mode2up_138]-210"
            - text: such as
            - link "Alexander Pushkin" [ref=e1125] [cursor=pointer]:
              - /url: /wiki/Alexander_Pushkin
            - text: ","
            - link "Mikhail Lermontov" [ref=e1126] [cursor=pointer]:
              - /url: /wiki/Mikhail_Lermontov
            - text: ","
            - link "Afanasy Fet" [ref=e1127] [cursor=pointer]:
              - /url: /wiki/Afanasy_Fet
            - text: ","
            - link "Anton Chekhov" [ref=e1128] [cursor=pointer]:
              - /url: /wiki/Anton_Chekhov
            - text: and
            - link "Aleksey Tolstoy" [ref=e1129] [cursor=pointer]:
              - /url: /wiki/Aleksey_Nikolayevich_Tolstoy
            - text: ", among others. His most popular song is the wordless"
            - link "Vocalise" [ref=e1131] [cursor=pointer]:
              - /url: /wiki/Vocalise_(Rachmaninoff)
            - text: ", which he later arranged for orchestra."
            - superscript [ref=e1132]:
              - link "[208]" [ref=e1133] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage184mode2up_184]-212"
