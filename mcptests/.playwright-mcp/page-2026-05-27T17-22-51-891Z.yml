                - text: .
          - paragraph [ref=e1307]:
            - text: Rachmaninoff ranked among the finest pianists of his time,
            - superscript [ref=e1308]:
              - link "[220]" [ref=e1309] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESchonberg1997[httpsarchiveorgdetailslivesofgreatcomp00scho_1page522mode2up_522]-224"
            - text: along with
            - link "Leopold Godowsky" [ref=e1310] [cursor=pointer]:
              - /url: /wiki/Leopold_Godowsky
            - text: ","
            - link "Ignaz Friedman" [ref=e1311] [cursor=pointer]:
              - /url: /wiki/Ignaz_Friedman
            - text: ","
            - link "Moriz Rosenthal" [ref=e1312] [cursor=pointer]:
              - /url: /wiki/Moriz_Rosenthal
            - text: ","
            - link "Josef Lhévinne" [ref=e1313] [cursor=pointer]:
              - /url: /wiki/Josef_Lh%C3%A9vinne
            - text: ","
            - link "Ferruccio Busoni" [ref=e1314] [cursor=pointer]:
              - /url: /wiki/Ferruccio_Busoni
            - text: ", and"
            - link "Josef Hofmann" [ref=e1315] [cursor=pointer]:
              - /url: /wiki/Josef_Hofmann
            - text: ", and he was famed for possessing a clean and virtuosic technique. His playing was marked by precision, rhythmic drive, notable use of staccato and the ability to maintain clarity when playing works with complex textures. Rachmaninoff applied these qualities in music by"
            - link "Chopin" [ref=e1316] [cursor=pointer]:
              - /url: /wiki/Fr%C3%A9d%C3%A9ric_Chopin
            - text: ", including the"
            - link "B-flat minor Piano Sonata" [ref=e1317] [cursor=pointer]:
              - /url: /wiki/Piano_Sonata_No._2_(Chopin)
            - text: . Rachmaninoff's repertoire, excepting his own works, consisted mainly of standard 19th century virtuoso works plus music by
            - link "Bach" [ref=e1318] [cursor=pointer]:
              - /url: /wiki/Johann_Sebastian_Bach
            - text: ","
            - link "Beethoven" [ref=e1319] [cursor=pointer]:
              - /url: /wiki/Ludwig_van_Beethoven
            - text: ","
            - link "Borodin" [ref=e1320] [cursor=pointer]:
              - /url: /wiki/Alexander_Borodin
            - text: ","
            - link "Debussy" [ref=e1321] [cursor=pointer]:
              - /url: /wiki/Claude_Debussy
            - text: ","
            - link "Grieg" [ref=e1322] [cursor=pointer]:
              - /url: /wiki/Edvard_Grieg
            - text: ","
            - link "Liszt" [ref=e1323] [cursor=pointer]:
              - /url: /wiki/Franz_Liszt
            - text: ","
            - link "Mendelssohn" [ref=e1324] [cursor=pointer]:
              - /url: /wiki/Felix_Mendelssohn
            - text: ","
            - link "Mozart" [ref=e1325] [cursor=pointer]:
              - /url: /wiki/Wolfgang_Amadeus_Mozart
            - text: ","
            - link "Schubert" [ref=e1326] [cursor=pointer]:
              - /url: /wiki/Franz_Schubert
            - text: ","
            - link "Schumann" [ref=e1327] [cursor=pointer]:
              - /url: /wiki/Robert_Schumann
            - text: and
            - link "Tchaikovsky" [ref=e1328] [cursor=pointer]:
              - /url: /wiki/Pyotr_Ilyich_Tchaikovsky
            - text: .
            - superscript [ref=e1329]:
              - link "[221]" [ref=e1330] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001b[httpsarchiveorgdetailsnewgrovedictiona0020unsepage714mode2up_714]-225"
          - paragraph [ref=e1331]:
            - text: The two pieces Rachmaninoff singled out for praise from
            - link "Anton Rubinstein" [ref=e1332] [cursor=pointer]:
              - /url: /wiki/Anton_Rubinstein
            - text: "'s concerts became cornerstones for his own recital programs. The compositions were Beethoven's"
            - link "Appassionata" [ref=e1333] [cursor=pointer]:
              - /url: /wiki/Piano_Sonata_No._23_(Beethoven)
            - text: and Chopin's Funeral March Sonata. He may have based his interpretation of the Chopin sonata on that of Rubinstein. Rachmaninoff biographer Barrie Martyn points out similarities between written accounts of Rubinstein's interpretation and Rachmaninoff's audio recording of the work.
            - superscript [ref=e1334]:
              - link "[222]" [ref=e1335] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990368,_403–406-226"
          - generic [ref=e1336]:
            - heading "Technique" [level=3] [ref=e1337]
            - generic [ref=e1338]:
              - text: "["
              - link "edit" [ref=e1339] [cursor=pointer]:
                - /url: /w/index.php?title=Sergei_Rachmaninoff&action=edit&section=15
              - text: "]"
          - paragraph [ref=e1340]:
            - text: Rachmaninoff possessed large hands,
            - superscript [ref=e1341]:
              - link "[223]" [ref=e1342] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEDąbrowskiStankiewicz-JóźwickaKowalczykWróblewski20213-227"
            - text: with which he could easily maneuver through the most complex chordal configurations. His left hand technique was unusually powerful. His playing was marked by definition—where other pianists' playing became blurry-sounding from overuse of the pedal or deficiencies in finger technique, Rachmaninoff's textures were always crystal clear. Only Josef Hofmann and Josef Lhévinne shared this kind of clarity with him.
            - superscript [ref=e1343]:
              - link "[224]" [ref=e1344] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESchonberg1988[httpsarchiveorgdetailsvirtuosiclassica0000schopage317mode2up_317]-228"
            - text: All three men had Anton Rubinstein as a model for this kind of playing—Hofmann as a student of Rubinstein's,
            - superscript [ref=e1345]:
              - link "[225]" [ref=e1346] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTESchonberg1987[httpsarchiveorgdetailsgreatpianists000schopage384mode2up_384]-229"
            - text: Rachmaninoff from hearing his famous series of historical recitals in Moscow while studying with Zverev,
            - superscript [ref=e1347]:
              - link "[226]" [ref=e1348] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTERiesemann1934[httpsarchiveorgdetailsinernetdli2015179919pagen65mode2up_49–52]-230"
            - text: and Lhévinne from hearing and playing with him.
          - generic [ref=e1349]:
            - heading "Tone" [level=3] [ref=e1350]
            - generic [ref=e1351]:
              - text: "["
              - link "edit" [ref=e1352] [cursor=pointer]:
                - /url: /w/index.php?title=Sergei_Rachmaninoff&action=edit&section=16
              - text: "]"
          - figure "Rachmaninoff seated at a Steinway grand piano" [ref=e1353]:
            - link [ref=e1354] [cursor=pointer]:
              - /url: /wiki/File:Rachmaninoff_at_Steinway_grand_piano.jpg
              - img [ref=e1355]
            - generic [ref=e1356]: Rachmaninoff seated at a Steinway grand piano
          - paragraph [ref=e1357]:
            - text: Of Rachmaninoff's tone,
            - link "Arthur Rubinstein" [ref=e1358] [cursor=pointer]:
              - /url: /wiki/Arthur_Rubinstein
            - text: "wrote:"
          - blockquote [ref=e1359]:
            - paragraph [ref=e1360]:
              - text: I was always under the spell of his glorious and inimitable tone which could make me forget my uneasiness about his too rapidly fleeting fingers and his exaggerated
              - link "rubatos" [ref=e1362] [cursor=pointer]:
                - /url: /wiki/Tempo_rubato
              - text: . There was always the irresistible sensuous charm, not unlike
              - link "Kreisler" [ref=e1363] [cursor=pointer]:
                - /url: /wiki/Fritz_Kreisler
              - text: "'s."
              - superscript [ref=e1364]:
                - link "[227]" [ref=e1365] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTERubinstein1980[httpsarchiveorgdetailsmymanyyears0000rubipage468mode2up_468]-231"
          - paragraph [ref=e1366]:
            - text: Coupled to this tone was a vocal quality not unlike that attributed to Chopin's playing. With Rachmaninoff's extensive operatic experience, he was a great admirer of fine singing. As his records demonstrate, he possessed a tremendous ability to make a musical line sing, no matter how long the notes or how complex the supporting texture, with most of his interpretations taking on a narrative quality. With the stories he told at the keyboard came multiple voices—a
            - link "polyphonic" [ref=e1367] [cursor=pointer]:
              - /url: /wiki/Polyphony
            - text: dialogue, not the least in terms of dynamics. His 1940 recording of his transcription of the song "Daisies" captures this quality extremely well. On the recording, separate musical strands enter as if from various human voices in eloquent conversation. This ability came from an exceptional independence of fingers and hands.
            - superscript [ref=e1368]:
              - link "[228]" [ref=e1369] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage270mode2up_270]-232"
          - generic [ref=e1370]:
            - heading "Interpretations" [level=3] [ref=e1371]
            - generic [ref=e1372]:
              - text: "["
              - link "edit" [ref=e1373] [cursor=pointer]:
                - /url: /w/index.php?title=Sergei_Rachmaninoff&action=edit&section=17
              - text: "]"
          - figure "Rachmaninoff playing his Steinway grand piano at his home (1936 or before)" [ref=e1374]:
            - link [ref=e1375] [cursor=pointer]:
              - /url: /wiki/File:Rachmaninoff_playing_Steinway_grand_piano.jpg
              - img [ref=e1376]
            - generic [ref=e1377]:
              - text: Rachmaninoff playing his
              - link "Steinway" [ref=e1378] [cursor=pointer]:
                - /url: /wiki/Steinway
              - text: grand piano at his home (1936 or before)
          - paragraph [ref=e1379]:
            - text: Regardless of the music, Rachmaninoff always planned his performances carefully. He based his interpretations on the theory that each piece of music has a "culminating point". Regardless of where that point was or at which dynamic within that piece, the performer had to know how to approach it with absolute calculation and precision; otherwise, the whole construction of the piece could crumble and the piece could become disjointed. This was a practice he learned from Russian bass
            - link "Feodor Chaliapin" [ref=e1380] [cursor=pointer]:
              - /url: /wiki/Feodor_Chaliapin
            - text: ", a staunch friend."
            - superscript [ref=e1381]:
              - link "[221]" [ref=e1382] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001b[httpsarchiveorgdetailsnewgrovedictiona0020unsepage714mode2up_714]-225"
            - text: Paradoxically, Rachmaninoff often sounded like he was improvising, though he actually was not. While his interpretations were mosaics of tiny details, when those mosaics came together in performance, they might, according to the tempo of the piece being played, fly past at great speed, giving the impression of instant thought.
            - superscript [ref=e1383]:
              - link "[229]" [ref=e1384] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage268mode2up_268]-233"
          - paragraph [ref=e1385]:
            - text: One advantage Rachmaninoff had in this building process over most of his contemporaries was in approaching the pieces he played from the perspective of a composer rather than that of an interpreter. He believed "interpretation demands something of the creative instinct. If you are a composer, you have an affinity with other composers. You can make contact with their imaginations, knowing something of their problems and their ideals. You can give their works color. That is the most important thing for me in my interpretations, color. So you make music live. Without color it is dead."
            - superscript [ref=e1386]:
              - link "[230]" [ref=e1387] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMayne1936-234"
            - text: Nevertheless, Rachmaninoff also possessed a far better sense of structure than many of his contemporaries, such as Hofmann, or the majority of pianists from the previous generation, judging from their respective recordings.
            - superscript [ref=e1388]:
              - link "[228]" [ref=e1389] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage270mode2up_270]-232"
          - paragraph [ref=e1390]:
            - text: A recording that showcases Rachmaninoff's approach is the
            - link "Liszt" [ref=e1391] [cursor=pointer]:
              - /url: /wiki/Franz_Liszt
            - text: Second Polonaise, recorded in 1925.
            - link "Percy Grainger" [ref=e1392] [cursor=pointer]:
              - /url: /wiki/Percy_Grainger
            - text: ", who had been influenced by the composer and Liszt specialist"
            - link "Ferruccio Busoni" [ref=e1393] [cursor=pointer]:
              - /url: /wiki/Ferruccio_Busoni
            - text: ", had himself recorded the same piece a few years earlier. Rachmaninoff's performance is far more taut and concentrated than Grainger's. The Russian's drive and monumental conception bear a considerable difference to the Australian's more delicate perceptions. Grainger's textures are elaborate. Rachmaninoff shows the filigree as essential to the work's structure, not simply decorative."
            - superscript [ref=e1394]:
              - link "[231]" [ref=e1395] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage251mode2up_251]-235"
          - generic [ref=e1396]:
            - heading "Hand size and medical speculations" [level=3] [ref=e1397]
            - generic [ref=e1398]:
              - text: "["
              - link "edit" [ref=e1399] [cursor=pointer]:
                - /url: /w/index.php?title=Sergei_Rachmaninoff&action=edit&section=18
              - text: "]"
          - paragraph [ref=e1400]:
            - text: Along with his musical gifts, Rachmaninoff possessed physical gifts that placed him in good stead as a pianist, including large hands with a gigantic finger stretch.
            - link "Cyril Smith" [ref=e1401] [cursor=pointer]:
              - /url: /wiki/Cyril_Smith_(pianist)
            - text: noted that Rachmaninoff could play a
            - link "twelfth" [ref=e1402] [cursor=pointer]:
              - /url: /wiki/Interval_(music)#Compound_intervals
            - text: with the left hand playing C, Eb, G, C and G, and his right hand could play the notes C (index), E (3rd finger), G, C, and E (thumb).
            - superscript [ref=e1403]:
              - link "[232]" [ref=e1404] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001a[httpsarchiveorgdetailsrachmaninoff00norrpage77mode2up_77]-236"
            - superscript [ref=e1405]:
              - link "[233]" [ref=e1406] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEYoung1986[httpswwwncbinlmnihgovpmcarticlesPMC1351877pdfbmjcred00266-0038pdfpage1_1624]-237"
          - paragraph [ref=e1407]:
            - text: His hand size, in addition to his considerable height, slender frame, long limbs, narrow head, prominent ears, and thin nose has led to the suggestion that he may have had
            - link "Marfan syndrome" [ref=e1408] [cursor=pointer]:
              - /url: /wiki/Marfan_syndrome
            - text: ", a hereditary disorder of the"
            - link "connective tissue" [ref=e1409] [cursor=pointer]:
              - /url: /wiki/Connective_tissue
            - text: . This syndrome would have accounted for several minor ailments he suffered all his life, including back pain, arthritis, eye strain, and bruising of the fingertips.
            - superscript [ref=e1410]:
              - link "[234]" [ref=e1411] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEYoung1986[httpswwwncbinlmnihgovpmcarticlesPMC1351877pdfbmjcred00266-0038pdfpage2_1625–1626]-238"
            - text: An article in the Journal of the Royal Society of Medicine, however, pointed out that Rachmaninoff did not show many of the typical signs of Marfan syndrome, and instead suggested that he may have had
            - link "acromegaly" [ref=e1412] [cursor=pointer]:
              - /url: /wiki/Acromegaly
            - text: ", which, the article speculated, would possibly have accounted for stiffness Rachmaninoff experienced in his hands, and for the repeated periods of depression he experienced throughout his life, and could have possibly even been connected to his melanoma."
            - superscript [ref=e1413]:
              - link "[235]" [ref=e1414] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTERamachandranAronson2006-239"
          - generic [ref=e1415]:
            - heading "Recordings" [level=3] [ref=e1416]
            - generic [ref=e1417]:
              - text: "["
              - link "edit" [ref=e1418] [cursor=pointer]:
                - /url: /w/index.php?title=Sergei_Rachmaninoff&action=edit&section=19
              - text: "]"
          - note [ref=e1419]:
            - text: "See also:"
            - link "Sergei Rachmaninoff recordings" [ref=e1420] [cursor=pointer]:
              - /url: /wiki/Sergei_Rachmaninoff_recordings
          - paragraph [ref=e1421]:
            - text: Upon arriving in America, Rachmaninoff's poor financial situation prompted him in 1919 to record a selection of piano pieces for
            - link "Edison Records" [ref=e1422] [cursor=pointer]:
              - /url: /wiki/Edison_Records
            - text: on their "
            - link "Diamond Disc" [ref=e1423] [cursor=pointer]:
              - /url: /wiki/Diamond_Disc
            - text: "\" records, in a limited contract for ten released sides."
            - superscript [ref=e1424]:
              - link "[236]" [ref=e1425] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990439-240"
            - text: Rachmaninoff felt his performances varied in quality and requested final approval prior to a commercial release.
            - link "Edison" [ref=e1426] [cursor=pointer]:
              - /url: /wiki/Thomas_Edison
            - text: agreed, but still issued multiple takes, an unusual practice which was standard at Edison Records. Rachmaninoff and Edison Records were pleased with the released discs and wished to record more, but Edison refused, saying the ten sides were sufficient. This, in addition to technical issues in the recordings and Edison's lack of musical taste, led to Rachmaninoff's annoyance with the company, and as soon as his contract ended he left Edison Records.
            - superscript [ref=e1427]:
              - link "[237]" [ref=e1428] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990439–440-241"
          - figure "A Victor advertisement from March 1921 featuring Rachmaninoff" [ref=e1429]:
            - link [ref=e1430] [cursor=pointer]:
              - /url: /wiki/File:Rachmaninoff.jpg
              - img [ref=e1431]
            - generic [ref=e1432]:
              - text: A
              - link "Victor" [ref=e1433] [cursor=pointer]:
                - /url: /wiki/Victor_Talking_Machine_Company
              - text: advertisement from March 1921 featuring Rachmaninoff
          - paragraph [ref=e1434]:
            - text: In 1920, Rachmaninoff signed a contract with the
            - link "Victor Talking Machine Company" [ref=e1435] [cursor=pointer]:
              - /url: /wiki/Victor_Talking_Machine_Company
            - text: (later
            - link "RCA Victor" [ref=e1436] [cursor=pointer]:
              - /url: /wiki/RCA_Red_Seal
            - text: ).
            - superscript [ref=e1437]:
              - link "[238]" [ref=e1438] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990440-242"
            - text: Unlike Edison, the company was pleased to comply with his requests, and proudly advertised Rachmaninoff as one of their prominent recording artists. He continued to record for Victor until 1942, when the
            - link "American Federation of Musicians" [ref=e1439] [cursor=pointer]:
              - /url: /wiki/American_Federation_of_Musicians
            - text: imposed a
            - link "recording ban" [ref=e1440] [cursor=pointer]:
              - /url: /wiki/1942%E2%80%9344_musicians%27_strike
            - text: on their members in a strike over
            - link "royalty payments" [ref=e1441] [cursor=pointer]:
              - /url: /wiki/Royalty_payment
            - text: . Rachmaninoff died in March 1943, over a year and a half before RCA Victor settled with the union and resumed commercial recording activity.
          - table [ref=e1442]:
            - rowgroup [ref=e1443]:
              - row "External audio" [ref=e1444]:
                - columnheader "External audio" [ref=e1445]
              - row "audio icon Rachmaninoff performing Chopin's Piano Sonata No. 2" [ref=e1446]:
                - cell "audio icon Rachmaninoff performing Chopin's Piano Sonata No. 2" [ref=e1447]:
                  - link "audio icon" [ref=e1449] [cursor=pointer]:
                    - /url: /wiki/File:Nuvola_apps_arts.svg
                    - img "audio icon" [ref=e1450]
                  - link "Rachmaninoff performing" [ref=e1451] [cursor=pointer]:
                    - /url: https://archive.org/details/CHOPINSonataInB-flatMinor-NEWTRANSFER/01.I.Grave.mp3
                  - text: Chopin's
                  - link "Piano Sonata No. 2" [ref=e1452] [cursor=pointer]:
                    - /url: /wiki/Piano_Sonata_No._2_(Chopin)
          - paragraph [ref=e1453]:
            - text: When Rachmaninoff recorded his works, he would seek perfection, often re-recording them until he was satisfied.
            - superscript [ref=e1454]:
              - link "[239]" [ref=e1455] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBurkholder2007844-243"
            - superscript [ref=e1456]:
              - link "[240]" [ref=e1457] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage231mode2up_231–232]-244"
            - text: Particularly renowned are his renditions of Schumann's
            - link "Carnaval" [ref=e1459] [cursor=pointer]:
              - /url: /wiki/Carnaval_(Schumann)
            - text: and Chopin's
            - link "Piano Sonata No. 2" [ref=e1460] [cursor=pointer]:
              - /url: /wiki/Piano_Sonata_No._2_(Chopin)
            - text: ", along with many shorter pieces. He recorded all four of his piano concertos with the"
            - link "Philadelphia Orchestra" [ref=e1461] [cursor=pointer]:
              - /url: /wiki/Philadelphia_Orchestra
            - text: ; the first, third, and fourth concertos were recorded with
            - link "Eugene Ormandy" [ref=e1462] [cursor=pointer]:
              - /url: /wiki/Eugene_Ormandy
            - text: in 1939–41, and two versions of the second concerto with
            - link "Leopold Stokowski" [ref=e1463] [cursor=pointer]:
              - /url: /wiki/Leopold_Stokowski
            - text: in 1924 and 1929.
            - superscript [ref=e1464]:
              - link "[241]" [ref=e1465] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage421mode2up_421–422]-245"
            - text: He also made a recording of the Rhapsody on a Theme of Paganini, soon after its first performance (1934) with the Philadelphians under Stokowski, in addition to three recordings he made as conductor with the
            - link "Philadelphia Orchestra" [ref=e1466] [cursor=pointer]:
              - /url: /wiki/Philadelphia_Orchestra
            - text: ", playing his own"
            - link "Third Symphony" [ref=e1467] [cursor=pointer]:
              - /url: /wiki/Symphony_No._3_(Rachmaninoff)
            - text: ", his symphonic poem"
            - link "Isle of the Dead" [ref=e1469] [cursor=pointer]:
              - /url: /wiki/Isle_of_the_Dead_(Rachmaninoff)
            - text: ", and his orchestration of"
            - link "Vocalise" [ref=e1471] [cursor=pointer]:
              - /url: /wiki/Vocalise_(Rachmaninoff)
            - text: .
            - superscript [ref=e1472]:
              - link "[241]" [ref=e1473] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage421mode2up_421–422]-245"
            - superscript [ref=e1474]:
              - link "[e]" [ref=e1475] [cursor=pointer]:
                - /url: "#cite_note-246"
          - paragraph [ref=e1476]:
            - text: Rachmaninoff also recorded a number of piano rolls on the
            - link "reproducing piano" [ref=e1477] [cursor=pointer]:
              - /url: /wiki/Reproducing_piano
            - text: of the
            - link "American Piano Company (Ampico)" [ref=e1478] [cursor=pointer]:
              - /url: /wiki/American_Piano_Company
            - text: ", producing a total of 35 piano rolls from 1919 to 1929, 12 of which were of his own compositions."
            - superscript [ref=e1479]:
              - link "[242]" [ref=e1480] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990499-247"
            - superscript [ref=e1481]:
              - link "[243]" [ref=e1482] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage223mode2up_223]-248"
            - text: He began recording rolls for Ampico in March 1919, upon the suggestion of his friend
            - link "Fritz Kreisler" [ref=e1483] [cursor=pointer]:
              - /url: /wiki/Fritz_Kreisler
            - text: ", and continued doing so, on and off, until around February 1929, though his last roll, of Chopin's"
            - link "Scherzo No. 2" [ref=e1484] [cursor=pointer]:
              - /url: /wiki/Scherzo_No._2_(Chopin)
            - text: ", was not published until October 1933."
            - superscript [ref=e1485]:
              - link "[244]" [ref=e1486] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990498–499,_505-249"
            - superscript [ref=e1487]:
              - link "[245]" [ref=e1488] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEObenchain198729-250"
            - text: Of the works he produced piano rolls for, he also made gramophone recordings of 29, and these provide evidence for Rachmaninoff's consistency of interpretation.
            - superscript [ref=e1489]:
              - link "[242]" [ref=e1490] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990499-247"
            - text: In addition, there also survives an unpublished piano roll of the second movement of his Second Piano Concerto, which may be indicative of Rachmaninoff having made other rolls.
            - superscript [ref=e1491]:
              - link "[242]" [ref=e1492] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990499-247"
          - generic [ref=e1493]:
            - heading "Conductor" [level=2] [ref=e1494]
            - generic [ref=e1495]:
              - text: "["
              - link "edit" [ref=e1496] [cursor=pointer]:
                - /url: /w/index.php?title=Sergei_Rachmaninoff&action=edit&section=20
              - text: "]"
          - paragraph [ref=e1497]:
            - text: Apart from several performances, including two of his opera Aleko in 1893, Rachmaninoff first began conducting in 1897, and performed as a conductor every year until 1914.
            - superscript [ref=e1498]:
              - link "[246]" [ref=e1499] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990509–10,_519-251"
            - text: After leaving Russia permanently in 1917, Rachmaninoff prioritised performing as a pianist to conducting, giving only seven more recitals as a conductor until the end of his life.
            - superscript [ref=e1500]:
              - link "[247]" [ref=e1501] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990522-252"
          - paragraph [ref=e1502]:
            - text: Rachmaninoff was noted for his restraint in conducting, and for the "simple and unpolished" manner in which he gestured to the orchestra.
            - superscript [ref=e1503]:
              - link "[248]" [ref=e1504] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990516&ndash;517-253"
            - text: According to
            - link "Alexander Goldenweiser" [ref=e1505] [cursor=pointer]:
              - /url: /wiki/Alexander_Goldenweiser_(composer)
            - text: ", his performances as a conductor were much stricter and less rhythmically free than his performances on the piano."
            - superscript [ref=e1506]:
              - link "[249]" [ref=e1507] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990518–519-254"
            - text: In
            - link "Nikolai Medtner" [ref=e1508] [cursor=pointer]:
              - /url: /wiki/Nikolai_Medtner
            - text: "'s estimation, he was \"the greatest Russian conductor\"."
            - superscript [ref=e1509]:
              - link "[250]" [ref=e1510] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990523-255"
          - paragraph [ref=e1511]:
            - text: In addition to his own works, Rachmaninoff conducted repertoire primarily from fellow Russian composers, such as
            - link "Borodin" [ref=e1512] [cursor=pointer]:
              - /url: /wiki/Borodin
            - text: ","
            - link "Glazunov" [ref=e1513] [cursor=pointer]:
              - /url: /wiki/Alexander_Glazunov
            - text: ","
            - link "Glinka" [ref=e1514] [cursor=pointer]:
              - /url: /wiki/Mikhail_Glinka
            - text: ","
            - link "Lyadov" [ref=e1515] [cursor=pointer]:
              - /url: /wiki/Anatoly_Lyadov
            - text: ","
            - link "Mussorgsky" [ref=e1516] [cursor=pointer]:
              - /url: /wiki/Mussorgsky
            - text: ","
            - link "Rimsky-Korsakov" [ref=e1517] [cursor=pointer]:
              - /url: /wiki/Rimsky-Korsakov
            - text: and
            - link "Tchaikovsky" [ref=e1518] [cursor=pointer]:
              - /url: /wiki/Tchaikovsky
            - text: ", as well as other composers such as"
            - link "Grieg" [ref=e1519] [cursor=pointer]:
              - /url: /wiki/Grieg
            - text: and
            - link "Liszt" [ref=e1520] [cursor=pointer]:
              - /url: /wiki/Liszt
            - text: .
            - superscript [ref=e1521]:
              - link "[251]" [ref=e1522] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990526–531-256"
            - text: Outside of Russia, Rachmaninoff conducted almost exclusively his own works.
            - superscript [ref=e1523]:
              - link "[252]" [ref=e1524] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEMartyn1990519-257"
          - generic [ref=e1525]:
            - heading "Reputation and legacy" [level=2] [ref=e1526]
            - generic [ref=e1527]:
              - text: "["
              - link "edit" [ref=e1528] [cursor=pointer]:
                - /url: /w/index.php?title=Sergei_Rachmaninoff&action=edit&section=21
              - text: "]"
          - figure "Upper part of Rachmaninoff's statue by Alexandr Rukavishnikov [ru] in Veliky Novgorod" [ref=e1529]:
            - link [ref=e1530] [cursor=pointer]:
              - /url: /wiki/File:Nowgorod,_pomnik_Rachmaninow_z_gol%C4%99biami.jpg
              - img [ref=e1531]
            - generic [ref=e1532]:
              - text: Upper part of Rachmaninoff's statue by
              - link "Alexandr Rukavishnikov" [ref=e1533] [cursor=pointer]:
                - /url: /w/index.php?title=Alexandr_Rukavishnikov&action=edit&redlink=1
              - generic [ref=e1534]:
