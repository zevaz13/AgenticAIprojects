                  - /url: /wiki/Morceaux_de_fantaisie
                - text: ) performed by Oksana Yevsyukova (piano)
          - paragraph [ref=e1183]:
            - text: Rachmaninoff's style was initially influenced by
            - link "Tchaikovsky" [ref=e1184] [cursor=pointer]:
              - /url: /wiki/Pyotr_Ilyich_Tchaikovsky
            - text: . By the mid-1890s, however, his compositions began showing a more individual tone. His First Symphony has many original features. Its brutal gestures and uncompromising power of expression were unprecedented in Russian music at the time. Its flexible
            - link "rhythms" [ref=e1185] [cursor=pointer]:
              - /url: /wiki/Rhythm
            - text: ", sweeping lyricism, and stringent economy of thematic material were all features he kept and refined in subsequent works. Following the poor reception of the symphony and three years of inactivity, Rachmaninoff's individual style developed significantly. He started leaning towards broadly lyrical, often passionate melodies. His orchestration became subtler and more varied, with textures carefully contrasted. Overall, his writing became more concise."
            - superscript [ref=e1186]:
              - link "[209]" [ref=e1187] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001b[httpsarchiveorgdetailsnewgrovedictiona0020unsepage714mode2up_714–715]-213"
          - paragraph [ref=e1188]:
            - text: "Especially important is Rachmaninoff's use of unusually widely spaced chords for bell-like sounds: this occurs in many pieces, most notably in the"
            - link "choral symphony" [ref=e1189] [cursor=pointer]:
              - /url: /wiki/Choral_symphony
            - text: The Bells, the Second Piano Concerto, the E-flat major Étude-Tableaux (Op. 33, No. 7), and the B minor Prelude (Op. 32, No. 10). "It is not enough to say that the church bells of Novgorod, St Petersburg and Moscow influenced Rachmaninov and feature prominently in his music. This much is self-evident. What is extraordinary is the variety of bell sounds and breadth of structural and other functions they fulfill."
            - superscript [ref=e1190]:
              - link "[210]" [ref=e1191] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTECarruthers200649-214"
            - text: He was also fond of Russian Orthodox chants. He used them most perceptibly in his Vespers, but many of his melodies found their origins in these chants. The opening melody of the First Symphony is derived from chants. (The opening melody of the Third Piano Concerto, on the other hand, is not derived from chants; when asked, Rachmaninoff said that "it had [written] itself".)
            - superscript [ref=e1192]:
              - link "[211]" [ref=e1193] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertenssonLeyda1956[httpsarchiveorgdetailssergeirachmanino0000bertpage158mode2up_158]-215"
            - superscript [ref=e1194]:
              - link "[212]" [ref=e1195] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEYasser1969325-216"
          - figure "Rachmaninoff with a piano score" [ref=e1196]:
            - link [ref=e1197] [cursor=pointer]:
              - /url: /wiki/File:Sergei_Rachmaninoff_LOC_31755.jpg
              - img [ref=e1198]
            - generic [ref=e1199]: Rachmaninoff with a piano score
          - paragraph [ref=e1200]:
            - text: Rachmaninoff's frequently used motifs include the
            - link "Dies irae" [ref=e1202] [cursor=pointer]:
              - /url: /wiki/Dies_irae
            - text: ","
            - superscript [ref=e1203]:
              - link "[213]" [ref=e1204] [cursor=pointer]:
                - /url: "#cite_note-217"
            - text: often just the fragments of the first phrase. Rachmaninoff had great command of
            - link "counterpoint" [ref=e1205] [cursor=pointer]:
              - /url: /wiki/Counterpoint
            - text: and
            - link "fugal" [ref=e1206] [cursor=pointer]:
              - /url: /wiki/Fugue
            - text: writing, thanks to his studies with Taneyev. The above-mentioned occurrence of the Dies irae in the
            - link "Second Symphony" [ref=e1207] [cursor=pointer]:
              - /url: /wiki/Symphony_No._2_(Rachmaninoff)
            - text: (1907) is but a small example of this. Very characteristic of his writing is
            - link "chromatic" [ref=e1208] [cursor=pointer]:
              - /url: /wiki/Chromatic_scale
            - text: counterpoint. This talent was paired with a confidence in writing in both large- and small-scale forms. The
            - link "Third Piano Concerto" [ref=e1209] [cursor=pointer]:
              - /url: /wiki/Piano_Concerto_No._3_(Rachmaninoff)
            - text: especially shows a structural ingenuity, while each of the preludes grows from a tiny melodic or rhythmic fragment into a taut, powerfully evocative miniature, crystallizing a particular mood or sentiment while employing a complexity of texture, rhythmic flexibility and a pungent chromatic harmony.
            - superscript [ref=e1210]:
              - link "[214]" [ref=e1211] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001b[httpsarchiveorgdetailsnewgrovedictiona0020unsepage715mode2up_715]-218"
          - paragraph [ref=e1212]:
            - text: His compositional style had already begun changing before the
            - link "October Revolution" [ref=e1213] [cursor=pointer]:
              - /url: /wiki/October_Revolution
            - text: deprived him of his homeland. The
            - link "harmonic" [ref=e1214] [cursor=pointer]:
              - /url: /wiki/Harmony
            - text: writing in The Bells was composed in 1913 but not published until 1920. This may have been due to Rachmaninoff's main publisher, Gutheil, having died in 1914 and Gutheil's catalog being acquired by
            - link "Serge Koussevitsky" [ref=e1215] [cursor=pointer]:
              - /url: /wiki/Serge_Koussevitsky
            - text: .
            - superscript [ref=e1216]:
              - link "[215]" [ref=e1217] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage191mode2up_191]-219"
            - text: The Bells became as advanced as in any of the works Rachmaninoff would write in Russia, partly because the melodic material has a harmonic aspect which arises from its
            - link "chromatic" [ref=e1218] [cursor=pointer]:
              - /url: /wiki/Chromaticism
            - link "ornamentation" [ref=e1219] [cursor=pointer]:
              - /url: /wiki/Ornamentation_(music)
            - text: .
            - superscript [ref=e1220]:
              - link "[216]" [ref=e1221] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage190mode2up_190–191]-220"
            - text: Further changes are apparent in the revised
            - link "First Piano Concerto" [ref=e1222] [cursor=pointer]:
              - /url: /wiki/Piano_Concerto_No._1_(Rachmaninoff)
            - text: ", which he finished just before leaving Russia, as well as in the Op. 38 songs and Op. 39"
            - link "Études-Tableaux" [ref=e1223] [cursor=pointer]:
              - /url: /wiki/%C3%89tudes-Tableaux,_Op._39
            - text: . In both these sets Rachmaninoff was less concerned with pure melody than with coloring. His near-
            - link "Impressionist" [ref=e1224] [cursor=pointer]:
              - /url: /wiki/Impressionism
            - text: style perfectly matched the texts by
            - link "symbolist" [ref=e1225] [cursor=pointer]:
              - /url: /wiki/Symbolism_(movement)
            - text: poets.
            - superscript [ref=e1226]:
              - link "[217]" [ref=e1227] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001b[httpsarchiveorgdetailsnewgrovedictiona0020unsepage716mode2up_716]-221"
            - text: The Op. 39 Études-Tableaux are among the most demanding pieces he wrote for any medium, both technically and in the sense that the player must see beyond any technical challenges to a considerable array of emotions, then unify all these aspects.
            - superscript [ref=e1228]:
              - link "[218]" [ref=e1229] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEHarrison2006[httpsarchiveorgdetailsrachmaninofflife0000harrpage207mode2up_207]-222"
          - paragraph [ref=e1230]:
            - text: The composer's friend Vladimir Wilshaw noticed this compositional change continuing in the early 1930s, with a difference between the sometimes very extroverted Op. 39 Études-Tableaux (the composer had broken a string on the piano at one performance) and the
            - link "Variations on a Theme of Corelli" [ref=e1232] [cursor=pointer]:
              - /url: /wiki/Variations_on_a_Theme_of_Corelli
            - text: (Op. 42, 1931). The variations show an even greater textural clarity than in the Op. 38 songs, combined with a more abrasive use of chromatic harmony and a new rhythmic incisiveness. This would be characteristic of all his later works—the
            - link "Piano Concerto No. 4" [ref=e1233] [cursor=pointer]:
              - /url: /wiki/Piano_Concerto_No._4_(Rachmaninoff)
            - text: (Op. 40, 1926) is composed in a more emotionally introverted style, with a greater clarity of texture. Nevertheless, some of his most beautiful (nostalgic and melancholy) melodies occur in the
            - link "Third Symphony" [ref=e1234] [cursor=pointer]:
              - /url: /wiki/Symphony_No._3_(Rachmaninoff)
            - text: ","
            - link "Rhapsody on a Theme of Paganini" [ref=e1236] [cursor=pointer]:
              - /url: /wiki/Rhapsody_on_a_Theme_of_Paganini
            - text: ", and"
            - link "Symphonic Dances" [ref=e1238] [cursor=pointer]:
              - /url: /wiki/Symphonic_Dances_(Rachmaninoff)
            - text: .
            - superscript [ref=e1239]:
              - link "[217]" [ref=e1240] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTENorris2001b[httpsarchiveorgdetailsnewgrovedictiona0020unsepage716mode2up_716]-221"
          - paragraph [ref=e1241]:
            - text: Music theorist and musicologist
            - link "Joseph Yasser" [ref=e1242] [cursor=pointer]:
              - /url: /wiki/Joseph_Yasser
            - text: ", as early as 1951, uncovered progressive tendencies in Rachmaninoff's compositions. He uncovered Rachmaninoff's use of an intra-tonal"
            - link "chromaticism" [ref=e1243] [cursor=pointer]:
              - /url: /wiki/Chromaticism
            - text: that stands in notable contrast to the inter-tonal chromaticism of
            - link "Richard Wagner" [ref=e1244] [cursor=pointer]:
              - /url: /wiki/Richard_Wagner
            - text: and strikingly contrasts the extra-tonal chromaticism of the more radical twentieth century composers like
            - link "Arnold Schoenberg" [ref=e1245] [cursor=pointer]:
              - /url: /wiki/Arnold_Schoenberg
            - text: . Yasser postulated that a variable, subtle, but unmistakable characteristic use of this intra-tonal chromaticism permeated Rachmaninoff's music.
            - superscript [ref=e1246]:
              - link "[219]" [ref=e1247] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEYasser1951-223"
          - generic [ref=e1248]:
